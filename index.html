<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ML6CMG Chord Finder</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at top,#293951 0%,#111827 45%,#070b12 100%);
}

header{
    text-align:center;
    padding:22px 15px 12px;
}

header h1{
    margin:0;
    font-size:30px;
    letter-spacing:1px;
}

header p{
    margin:7px 0 0;
    color:#cbd5e1;
}

.container{
    width:min(1200px,96%);
    margin:auto;
}

.panel{
    background:rgba(15,23,42,.94);
    border-radius:20px;
    padding:18px;
    margin-top:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

/* CIRCLE */

.circle-title{
    text-align:center;
    margin:0 0 15px;
}

.circle{
    position:relative;
    width:min(90vw,460px);
    height:min(90vw,460px);
    margin:auto;
    border-radius:50%;
    background:
      radial-gradient(circle,
      #0d1524 0 27%,
      #253653 28% 52%,
      #172033 53% 70%,
      #0b1220 71%);
    border:3px solid #64748b;
    box-shadow:inset 0 0 35px #000;
}

.circle-center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:105px;
    height:105px;
    border-radius:50%;
    background:#0b1220;
    border:2px solid #94a3b8;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-weight:bold;
    font-size:18px;
}

.note{
    position:absolute;
    width:56px;
    height:56px;
    margin:-28px;
    border-radius:50%;
    border:2px solid #94a3b8;
    background:#1e293b;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
}

.note:hover,
.note.active{
    background:#d4af37;
    color:#111827;
    transform:scale(1.12);
}

.minor-note{
    width:46px;
    height:46px;
    margin:-23px;
    font-size:12px;
    background:#111827;
}

/* CHORD SELECTION */

.selected{
    text-align:center;
    font-size:31px;
    font-weight:bold;
    color:#f8e08e;
    margin-bottom:15px;
}

.search{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #475569;
    background:#0f172a;
    color:#fff;
    font-size:16px;
    margin-bottom:15px;
}

.category{
    margin-bottom:16px;
}

.category h3{
    margin:0 0 8px;
    font-size:14px;
    color:#94a3b8;
    text-transform:uppercase;
    letter-spacing:1px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.chord-button{
    background:#1e293b;
    color:#fff;
    border:1px solid #64748b;
    border-radius:10px;
    padding:10px 13px;
    cursor:pointer;
    font-size:14px;
}

.chord-button:hover,
.chord-button.active{
    background:#d4af37;
    color:#111827;
}

/* INSTRUMENTS */

.instrument-buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:9px;
}

.instrument-button{
    padding:11px 16px;
    border-radius:12px;
    border:1px solid #64748b;
    background:#111827;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.instrument-button.active{
    background:#d4af37;
    color:#111827;
}

/* DIAGRAMS */

.diagram-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:16px;
    margin-top:16px;
}

.card{
    background:#0f172a;
    border:1px solid #334155;
    border-radius:18px;
    padding:15px;
    min-height:390px;
}

.card h2{
    text-align:center;
    margin:0;
    color:#f8e08e;
}

.card .type{
    text-align:center;
    color:#94a3b8;
    font-size:13px;
    margin:5px 0 15px;
}

.diagram{
    min-height:290px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* FRETTED */

.fret-diagram{
    width:280px;
    height:300px;
    position:relative;
}

.fretboard{
    position:absolute;
    left:45px;
    right:15px;
    top:45px;
    bottom:30px;
    border-left:4px solid #eee;
    border-top:5px solid #eee;
}

.fretboard:after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    top:0;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent calc(20% - 1px),
        #94a3b8 calc(20% - 1px),
        #94a3b8 20%
      ),
      repeating-linear-gradient(
        to right,
        transparent 0,
        transparent calc(25% - 1px),
        #94a3b8 calc(25% - 1px),
        #94a3b8 25%
      );
}

.string{
    position:absolute;
    top:0;
    bottom:0;
    width:2px;
    background:#d1d5db;
    z-index:2;
}

.finger{
    position:absolute;
    width:30px;
    height:30px;
    margin:-15px;
    border-radius:50%;
    background:#d4af37;
    color:#111827;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    z-index:5;
}

.open,
.muted{
    position:absolute;
    top:10px;
    transform:translateX(-50%);
    font-size:20px;
    font-weight:bold;
    z-index:6;
}

.open{color:#86efac}
.muted{color:#f87171}

.string-name{
    position:absolute;
    left:8px;
    transform:translateX(-50%);
    color:#94a3b8;
    font-size:11px;
}

.fret-label{
    position:absolute;
    left:17px;
    color:#94a3b8;
    font-size:10px;
}

/* PIANO */

.piano{
    position:relative;
    width:280px;
    height:180px;
}

.white-key{
    position:absolute;
    top:0;
    height:170px;
    width:40px;
    background:#fff;
    border:1px solid #111827;
    z-index:1;
}

.white-key.active{
    background:#d4af37;
}

.black-key{
    position:absolute;
    top:0;
    width:25px;
    height:105px;
    background:#050505;
    border-radius:0 0 5px 5px;
    z-index:3;
}

.black-key.active{
    background:#d4af37;
}

.key-label{
    position:absolute;
    bottom:8px;
    width:100%;
    text-align:center;
    color:#111827;
    font-size:10px;
    font-weight:bold;
}

.note-list{
    text-align:center;
    margin-top:10px;
    color:#cbd5e1;
    font-size:13px;
}

.badge{
    display:block;
    text-align:center;
    color:#94a3b8;
    font-size:11px;
    margin-top:10px;
}

footer{
    text-align:center;
    padding:30px;
    color:#64748b;
    font-size:12px;
}

@media(max-width:600px){
    header h1{font-size:25px}
    .circle{width:88vw;height:88vw}
    .note{width:50px;height:50px;margin:-25px}
    .minor-note{width:41px;height:41px;margin:-20.5px}
    .diagram-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
    <h1>🎵 ML6CMG Chord Finder</h1>
    <p>Visual chords for guitar, ukulele, mandolin & piano</p>
</header>

<div class="container">

<section class="panel">

    <h2 class="circle-title">Circle of Fifths</h2>

    <div class="circle" id="circle">

        <div class="circle-center" id="circleCenter">
            C Major
        </div>

    </div>

</section>


<section class="panel">

    <div class="selected" id="selectedChord">
        C Major
    </div>

    <input
        class="search"
        id="search"
        placeholder="Search chords e.g. C7, Gm, Fmaj9..."
    >

    <div id="chordButtons"></div>

</section>


<section class="panel">

    <h3 style="text-align:center;margin-top:0">
        Show instruments
    </h3>

    <div class="instrument-buttons">

        <button class="instrument-button active"
                data-instrument="guitar">
            🎸 Guitar
        </button>

        <button class="instrument-button active"
                data-instrument="ukulele">
            🪕 Ukulele
        </button>

        <button class="instrument-button active"
                data-instrument="mandolin">
            🎻 Mandolin
        </button>

        <button class="instrument-button active"
                data-instrument="piano">
            🎹 Piano
        </button>

    </div>

</section>


<section class="diagram-grid" id="diagramGrid"></section>

</div>

<footer>
    ML6 Community Music Group • ML6CMG Chord Finder
</footer>


<script>

/* =========================================================
   ROOT NOTES
========================================================= */

const ROOTS = [
    "C","C#","D","Eb","E","F",
    "F#","G","Ab","A","Bb","B"
];


/* =========================================================
   CIRCLE OF FIFTHS
========================================================= */

const CIRCLE_MAJOR = [
    "C","G","D","A","E","B",
    "F#","C#","Ab","Eb","Bb","F"
];

const CIRCLE_MINOR = [
    "Am","Em","Bm","F#m","C#m","G#m",
    "D#m","A#m","Fm","Cm","Gm","Dm"
];


/* =========================================================
   CHORD TYPES
========================================================= */

const CHORD_TYPES = [

    {
        category:"Basic",
        items:[
            ["Major",""],
            ["Minor","m"]
        ]
    },

    {
        category:"Suspended",
        items:[
            ["Sus2","sus2"],
            ["Sus4","sus4"]
        ]
    },

    {
        category:"6th",
        items:[
            ["6","6"],
            ["Minor 6","m6"]
        ]
    },

    {
        category:"7th",
        items:[
            ["7","7"],
            ["Major 7","maj7"],
            ["Minor 7","m7"],
            ["Minor 7♭5","m7b5"],
            ["Diminished 7","dim7"]
        ]
    },

    {
        category:"9th",
        items:[
            ["Add9","add9"],
            ["9","9"],
            ["Major 9","maj9"],
            ["Minor 9","m9"]
        ]
    },

    {
        category:"11th",
        items:[
            ["11","11"],
            ["Major 11","maj11"],
            ["Minor 11","m11"]
        ]
    },

    {
        category:"13th",
        items:[
            ["13","13"],
            ["Major 13","maj13"],
            ["Minor 13","m13"]
        ]
    },

    {
        category:"Altered",
        items:[
            ["Diminished","dim"],
            ["Augmented","aug"]
        ]
    }
];


/* =========================================================
   CHORD INTERVAL FORMULAS
   0 = root
   1 = minor 2nd
   2 = major 2nd
   3 = minor 3rd
   4 = major 3rd
   5 = perfect 4th
   6 = tritone
   7 = perfect 5th
   8 = minor 6th
   9 = major 6th
   10 = minor 7th
   11 = major 7th
========================================================= */

const FORMULAS = {

    "":[0,4,7],
    "m":[0,3,7],

    "sus2":[0,2,7],
    "sus4":[0,5,7],

    "6":[0,4,7,9],
    "m6":[0,3,7,9],

    "7":[0,4,7,10],
    "maj7":[0,4,7,11],
    "m7":[0,3,7,10],

    "m7b5":[0,3,6,10],

    "dim":[0,3,6],
    "dim7":[0,3,6,9],

    "aug":[0,4,8],

    "add9":[0,4,7,2],
    "9":[0,4,7,10,2],
    "maj9":[0,4,7,11,2],
    "m9":[0,3,7,10,2],

    "11":[0,4,7,10,2,5],
    "maj11":[0,4,7,11,2,5],
    "m11":[0,3,7,10,2,5],

    "13":[0,4,7,10,2,5,9],
    "maj13":[0,4,7,11,2,5,9],
    "m13":[0,3,7,10,2,5,9]
};


/* =========================================================
   NOTE NAMES
========================================================= */

const NOTE_NAMES = [
    "C","C#","D","Eb","E","F",
    "F#","G","Ab","A","Bb","B"
];

const NOTE_INDEX = {
    "C":0,
    "C#":1,
    "Db":1,
    "D":2,
    "D#":3,
    "Eb":3,
    "E":4,
    "F":5,
    "F#":6,
    "Gb":6,
    "G":7,
    "G#":8,
    "Ab":8,
    "A":9,
    "A#":10,
    "Bb":10,
    "B":11
};


/* =========================================================
   CURRENT STATE
========================================================= */

let selectedRoot = "C";
let selectedType = "";

let activeInstruments = {
    guitar:true,
    ukulele:true,
    mandolin:true,
    piano:true
};


/* =========================================================
   BUILD CIRCLE
========================================================= */

function buildCircle(){

    const circle =
        document.getElementById("circle");

    CIRCLE_MAJOR.forEach((note,i)=>{

        const angle =
            (i*30-90)*Math.PI/180;

        const x =
            50+41*Math.cos(angle);

        const y =
            50+41*Math.sin(angle);

        const b =
            document.createElement("button");

        b.className="note";

        b.style.left=x+"%";
        b.style.top=y+"%";

        b.textContent=note;

        b.onclick=()=>{

            selectedRoot=note;
            selectedType="";

            document
              .querySelectorAll(".note")
              .forEach(n=>n.classList.remove("active"));

            b.classList.add("active");

            update();
        };

        circle.appendChild(b);
    });


    CIRCLE_MINOR.forEach((note,i)=>{

        const angle =
            (i*30-90)*Math.PI/180;

        const x =
            50+29*Math.cos(angle);

        const y =
            50+29*Math.sin(angle);

        const b =
            document.createElement("button");

        b.className="note minor-note";

        b.style.left=x+"%";
        b.style.top=y+"%";

        b.textContent=note;

        b.onclick=()=>{

            selectedRoot=note.replace("m","");
            selectedType="m";

            document
              .querySelectorAll(".note")
              .forEach(n=>n.classList.remove("active"));

            b.classList.add("active");

            update();
        };

        circle.appendChild(b);
    });
}


/* =========================================================
   CHORD NAME
========================================================= */

function chordName(){

    const names={
        "":"Major",
        "m":"Minor",
        "sus2":"Sus2",
        "sus4":"Sus4",
        "6":"6",
        "m6":"Minor 6",
        "7":"7",
        "maj7":"Major 7",
        "m7":"Minor 7",
        "m7b5":"Minor 7♭5",
        "dim":"Diminished",
        "dim7":"Diminished 7",
        "aug":"Augmented",
        "add9":"Add9",
        "9":"9",
        "maj9":"Major 9",
        "m9":"Minor 9",
        "11":"11",
        "maj11":"Major 11",
        "m11":"Minor 11",
        "13":"13",
        "maj13":"Major 13",
        "m13":"Minor 13"
    };

    return selectedRoot+
      (selectedType==="" ? " Major" :
       " "+names[selectedType]);
}


/* =========================================================
   GET CHORD NOTES
========================================================= */

function chordNotes(root,type){

    const rootIndex=NOTE_INDEX[root];

    return FORMULAS[type].map(interval=>{

        return NOTE_NAMES[
            (rootIndex+interval+12)%12
        ];

    });
}


/* =========================================================
   BUILD CHORD BUTTONS
========================================================= */

function buildChordButtons(){

    const box =
        document.getElementById("chordButtons");

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    box.innerHTML="";

    CHORD_TYPES.forEach(group=>{

        const section =
            document.createElement("div");

        section.className="category";

        const heading =
            document.createElement("h3");

        heading.textContent=group.category;

        section.appendChild(heading);

        const buttons =
            document.createElement("div");

        buttons.className="buttons";

        group.items.forEach(([label,type])=>{

            const fullName =
                selectedRoot+type;

            if(search &&
              !fullName.toLowerCase().includes(search) &&
              !label.toLowerCase().includes(search)){
                return;
            }

            const b =
                document.createElement("button");

            b.className="chord-button";

            if(type===selectedType)
                b.classList.add("active");

            b.textContent=fullName;

            b.onclick=()=>{

                selectedType=type;
                update();
            };

            buttons.appendChild(b);
        });

        if(buttons.children.length)
            section.appendChild(buttons);

        if(buttons.children.length)
            box.appendChild(section);
    });
}


/* =========================================================
   FIND FRETTED-INSTRUMENT VOICING
========================================================= */

/*
   Guitar tuning:
   E A D G B E

   Ukulele:
   G C E A

   Mandolin:
   G D A E

   The algorithm searches for a compact voicing
   containing chord notes. It prioritises the root
   and avoids excessive stretches.
*/

const TUNINGS={

    guitar:[
        "E","A","D","G","B","E"
    ],

    ukulele:[
        "G","C","E","A"
    ],

    mandolin:[
        "G","D","A","E"
    ]
};


function midiFor(note,octave){

    return NOTE_INDEX[note]+
      (octave+1)*12;
}


/*
   Generate a practical suggested voicing.
*/

function generateVoicing(root,type,instrument){

    const tuning=TUNINGS[instrument];

    const notes=chordNotes(root,type);

    const rootIndex=NOTE_INDEX[root];

    let best=null;

    /*
      Search positions from open position through
      7th fret. For each string choose either muted
      or one of the first several matching frets.
    */

    function recurse(index,current){

        if(index===tuning.length){

            const played=current
                .filter(x=>x!==null);

            if(!played.length) return;

            const playedNotes =
                played.map(x=>x.note);

            /*
              Must contain root.
            */

            if(!playedNotes.includes(root))
                return;

            /*
              Count unique chord tones.
            */

            const unique =
                [...new Set(playedNotes)];

            let score=0;

            score +=
                unique.length*20;

            /*
              Prefer root in bass where possible.
            */

            if(current[0] &&
               current[0].note===root)
                score+=35;

            /*
              Penalise large frets.
            */

            current.forEach(x=>{
                if(x)
                    score-=x.fret*1.5;
            });

            /*
              Penalise too many muted strings.
            */

            score-=
              current.filter(x=>x===null).length*4;

            /*
              Penalise large stretch.
            */

            const frets=current
              .filter(x=>x)
              .map(x=>x.fret);

            if(frets.length){

                const stretch=
                    Math.max(...frets)-
                    Math.min(...frets);

                score-=stretch*5;
            }

            if(!best || score>best.score){

                best={
                    score,
                    shape:current.map(x=>
                        x ? x.fret : "X"
                    ),
                    notes:current
                };
            }

            return;
        }


        const openName=tuning[index];

        /*
          Check open string.
        */

        if(notes.includes(openName)){

            recurse(index+1,[
                ...current,
                {
                    fret:0,
                    note:openName
                }
            ]);
        }

        /*
          Check frets 1-7.
        */

        for(let fret=1;fret<=7;fret++){

            const note=
                NOTE_NAMES[
                  (NOTE_INDEX[openName]+fret)%12
                ];

            if(notes.includes(note)){

                recurse(index+1,[
                    ...current,
                    {
                        fret,
                        note
                    }
                ]);
            }
        }

        /*
          Allow muted string.
        */

        recurse(index+1,[
            ...current,
            null
        ]);
    }

    recurse(0,[]);

    return best;
}


/* =========================================================
   DRAW FRETTED DIAGRAM
========================================================= */

function drawFretted(instrument,voicing){

    const tuning=TUNINGS[instrument];

    const count=tuning.length;

    let html=
      `<div class="fret-diagram">`;

    html+=
      `<div class="fretboard"></div>`;

    /*
      Strings.
    */

    tuning.forEach((name,i)=>{

        const x=
            45+
            (220/(count-1))*i;

        html+=
          `<div class="string"
             style="left:${x}px">
           </div>`;

        html+=
          `<div class="string-name"
             style="left:${x}px;top:18px">
             ${name}
           </div>`;
    });


    /*
      Fret numbers.
    */

    for(let fret=1;fret<=5;fret++){

        const y=
            78+
            (210/5)*(fret-1);

        html+=
          `<div class="fret-label"
             style="top:${y}px">
             ${fret}
           </div>`;
    }


    /*
      Fingerings.
    */

    voicing.shape.forEach((fret,i)=>{

        const x=
            45+
            (220/(count-1))*i;

        if(fret==="X"){

            html+=
              `<div class="muted"
                 style="left:${x}px">
                 ×
               </div>`;

            return;
        }

        if(fret===0){

            html+=
              `<div class="open"
                 style="left:${x}px">
                 O
               </div>`;

            return;
        }

        const y=
            45+
            ((fret-0.5)*42);

        /*
          Finger number is based on fret
          position in this generated voicing.
        */

        const finger=
            Math.min(4,fret);

        html+=
          `<div class="finger"
             style="left:${x}px;top:${y}px">
             ${finger}
           </div>`;
    });

    html+=`</div>`;

    return html;
}


/* =========================================================
   PIANO
========================================================= */

function drawPiano(notes){

    const whites=[
        "C","D","E","F","G","A","B"
    ];

    let html=
      `<div>
         <div class="piano">`;

    whites.forEach((note,i)=>{

        const active=
            notes.includes(note);

        html+=
          `<div class="white-key ${active?"active":""}"
             style="left:${i*40}px">

             <div class="key-label">
                 ${note}
             </div>

           </div>`;
    });


    const blacks=[
        ["C#",28],
        ["D#",68],
        ["F#",148],
        ["G#",188],
        ["A#",228]
    ];

    blacks.forEach(([note,left])=>{

        const active=
            notes.includes(note);

        html+=
          `<div class="black-key ${active?"active":""}"
             style="left:${left}px">
           </div>`;
    });

    html+=
      `</div>
       <div class="note-list">
          ${notes.join(" • ")}
       </div>
      </div>`;

    return html;
}


/* =========================================================
   RENDER DIAGRAMS
========================================================= */

function render(){

    const grid=
        document.getElementById("diagramGrid");

    grid.innerHTML="";

    const notes=
        chordNotes(selectedRoot,selectedType);


    const instruments=[
        ["guitar","🎸 Guitar"],
        ["ukulele","🪕 Ukulele"],
        ["mandolin","🎻 Mandolin"],
        ["piano","🎹 Piano"]
    ];


    instruments.forEach(([instrument,title])=>{

        if(!activeInstruments[instrument])
            return;

        const card=
            document.createElement("div");

        card.className="card";

        card.innerHTML=
          `<h2>${title}</h2>
           <div class="type">
              ${selectedRoot}${selectedType}
           </div>`;


        const diagram=
            document.createElement("div");

        diagram.className="diagram";


        if(instrument==="piano"){

            diagram.innerHTML=
                drawPiano(notes);

        }else{

            const voicing=
                generateVoicing(
                    selectedRoot,
                    selectedType,
                    instrument
                );

            if(voicing){

                diagram.innerHTML=
                    drawFretted(
                        instrument,
                        voicing
                    );

                const badge=
                    document.createElement("span");

                badge.className="badge";

                badge.textContent=
                    "Suggested playable voicing";

                card.appendChild(diagram);
                card.appendChild(badge);

                grid.appendChild(card);

                return;
            }
        }


        card.appendChild(diagram);

        grid.appendChild(card);
    });
}


/* =========================================================
   UPDATE
========================================================= */

function update(){

    document.getElementById("selectedChord")
        .textContent=chordName();

    document.getElementById("circleCenter")
        .textContent=
            selectedRoot+
            (selectedType || " Major");

    buildChordButtons();

    render();
}


/* =========================================================
   INSTRUMENT BUTTONS
========================================================= */

document
.querySelectorAll(".instrument-button")
.forEach(button=>{

    button.onclick=()=>{

        const instrument=
            button.dataset.instrument;

        activeInstruments[instrument]=
            !activeInstruments[instrument];

        button.classList.toggle(
            "active",
            activeInstruments[instrument]
        );

        render();
    };
});


/* =========================================================
   SEARCH
========================================================= */

document
.getElementById("search")
.addEventListener("input",()=>{
    buildChordButtons();
});


/* =========================================================
   START
========================================================= */

buildCircle();

document
.querySelector('.note')
.classList.add("active");

update();

</script>

</body>
</html>
