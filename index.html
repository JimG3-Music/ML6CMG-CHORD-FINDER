<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ML6CMG Chord Finder</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:
        radial-gradient(circle at top,#26364e 0%,#101827 45%,#060a11 100%);
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    text-align:center;
    padding:22px 12px 10px;
}

header h1{
    margin:0;
    font-size:30px;
    letter-spacing:.5px;
}

header p{
    margin:7px 0 0;
    color:#b9c4d4;
}

.container{
    width:min(1200px,96%);
    margin:auto;
}

.panel{
    background:rgba(12,20,34,.97);
    border:1px solid #334155;
    border-radius:20px;
    padding:18px;
    margin:16px 0;
    box-shadow:0 12px 35px rgba(0,0,0,.28);
}

h2{margin-top:0}

/* =====================================================
   CIRCLE OF FIFTHS
===================================================== */

.circle-title{
    text-align:center;
    margin-bottom:15px;
}

.circle{
    position:relative;
    width:min(92vw,470px);
    height:min(92vw,470px);
    margin:auto;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            #0b1220 0 23%,
            #273850 24% 51%,
            #172236 52% 72%,
            #0b1220 73%
        );
    border:3px solid #64748b;
    box-shadow:inset 0 0 35px #000,0 10px 30px rgba(0,0,0,.4);
}

.circle-ring{
    position:absolute;
    border:1px solid #53647d;
    border-radius:50%;
    pointer-events:none;
}

.circle-ring.outer{inset:16%}
.circle-ring.inner{inset:29%}

.circle-center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:112px;
    height:112px;
    border-radius:50%;
    background:#0a111d;
    border:2px solid #d4af37;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-weight:bold;
    font-size:17px;
    padding:10px;
}

.circle-note{
    position:absolute;
    transform:translate(-50%,-50%);
    border:2px solid #94a3b8;
    background:#1e293b;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.15s;
    z-index:5;
}

.circle-note.major{
    width:55px;
    height:55px;
    border-radius:50%;
    font-size:16px;
}

.circle-note.minor{
    width:46px;
    height:46px;
    border-radius:50%;
    font-size:12px;
    background:#111827;
}

.circle-note:hover,
.circle-note.active{
    background:#d4af37;
    color:#101827;
    border-color:#f8e08e;
    transform:translate(-50%,-50%) scale(1.1);
}

.circle-legend{
    display:flex;
    justify-content:center;
    gap:22px;
    margin-top:14px;
    font-size:13px;
    color:#cbd5e1;
}

.legend-major{color:#f8e08e}
.legend-minor{color:#94a3b8}

/* =====================================================
   CHORD SELECTOR
===================================================== */

.selected-chord{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    color:#f8e08e;
    margin-bottom:8px;
}

.selected-notes{
    text-align:center;
    font-size:17px;
    color:#cbd5e1;
    margin-bottom:18px;
}

.search{
    width:100%;
    padding:13px;
    border-radius:11px;
    border:1px solid #475569;
    background:#0b1220;
    color:#fff;
    font-size:16px;
    margin-bottom:15px;
}

.category{margin-bottom:17px}

.category h3{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#94a3b8;
    margin:0 0 8px;
}

.chord-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.chord-button{
    padding:10px 13px;
    border-radius:10px;
    border:1px solid #475569;
    background:#1e293b;
    color:#fff;
    font-size:14px;
    cursor:pointer;
}

.chord-button:hover,
.chord-button.active{
    background:#d4af37;
    color:#111827;
    border-color:#f8e08e;
}

/* =====================================================
   INSTRUMENT BUTTONS
===================================================== */

.instrument-buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
}

.instrument-button{
    padding:11px 16px;
    border-radius:11px;
    border:1px solid #64748b;
    background:#111827;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.instrument-button.active{
    background:#d4af37;
    color:#111827;
}

/* =====================================================
   STAFF
===================================================== */

.staff-panel{margin-top:18px}

.staff-title{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    color:#f8e08e;
    margin-bottom:3px;
}

.staff-subtitle{
    text-align:center;
    color:#94a3b8;
    font-size:13px;
    margin-bottom:8px;
}

.staff-container{
    width:100%;
    overflow-x:auto;
}

.staff-svg{
    display:block;
    width:100%;
    min-width:620px;
    height:240px;
}

.staff-line{
    stroke:#d7dce3;
    stroke-width:2;
}

.staff-note{
    fill:#f8e08e;
    stroke:#111827;
    stroke-width:1.5;
}

.staff-note-label{
    fill:#fff;
    font-size:14px;
    font-weight:bold;
    text-anchor:middle;
}

.staff-accidental{
    fill:#fff;
    font-size:20px;
    font-weight:bold;
}

.staff-clef{
    fill:#fff;
    font-family:"Times New Roman",serif;
    font-size:82px;
}

.staff-ledger{
    stroke:#d7dce3;
    stroke-width:2;
}

/* =====================================================
   DIAGRAM GRID
===================================================== */

.diagram-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(285px,1fr));
    gap:16px;
}

.card{
    background:#0c1422;
    border:1px solid #334155;
    border-radius:18px;
    padding:15px;
    min-height:420px;
}

.card h2{
    text-align:center;
    margin:0;
    color:#f8e08e;
}

.card-sub{
    text-align:center;
    color:#94a3b8;
    font-size:12px;
    margin:5px 0 14px;
}

.diagram{
    height:300px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.badge{
    display:block;
    text-align:center;
    font-size:11px;
    color:#64748b;
    margin-top:7px;
}

/* =====================================================
   FRETBOARD
===================================================== */

.fret-diagram{
    width:285px;
    height:300px;
    position:relative;
}

.fretboard{
    position:absolute;
    left:50px;
    right:16px;
    top:47px;
    height:220px;
    border-left:4px solid #eee;
    border-top:5px solid #eee;
    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 43px,
            #94a3b8 43px,
            #94a3b8 45px
        ),
        repeating-linear-gradient(
            to right,
            transparent 0,
            transparent 53px,
            #94a3b8 53px,
            #94a3b8 55px
        );
}

.fret-string{
    position:absolute;
    top:0;
    bottom:0;
    width:2px;
    background:#d7dce3;
    z-index:3;
}

.string-label{
    position:absolute;
    top:18px;
    transform:translateX(-50%);
    font-size:11px;
    color:#94a3b8;
}

.fret-number{
    position:absolute;
    left:18px;
    font-size:10px;
    color:#94a3b8;
}

.open-mark,
.mute-mark{
    position:absolute;
    top:5px;
    transform:translateX(-50%);
    font-size:20px;
    font-weight:bold;
    z-index:8;
}

.open-mark{color:#86efac}
.mute-mark{color:#f87171}

.finger-dot{
    position:absolute;
    width:31px;
    height:31px;
    border-radius:50%;
    background:#d4af37;
    color:#111827;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:15px;
    z-index:8;
    transform:translate(-50%,-50%);
    border:2px solid #f8e08e;
    box-shadow:0 2px 7px rgba(0,0,0,.4);
}

.finger-key{pointer-events:none}

/* =====================================================
   PIANO
===================================================== */

.piano{
    position:relative;
    width:280px;
    height:190px;
}

.white-key{
    position:absolute;
    top:0;
    height:175px;
    width:40px;
    background:#fff;
    border:1px solid #111827;
    z-index:1;
}

.white-key.active{background:#d4af37}

.black-key{
    position:absolute;
    top:0;
    width:25px;
    height:108px;
    background:#050505;
    border-radius:0 0 5px 5px;
    z-index:3;
}

.black-key.active{background:#d4af37}

.key-name{
    position:absolute;
    bottom:8px;
    width:100%;
    text-align:center;
    color:#111827;
    font-size:10px;
    font-weight:bold;
}

.piano-notes{
    text-align:center;
    font-size:12px;
    color:#cbd5e1;
    margin-top:10px;
}

/* =====================================================
   FOOTER
===================================================== */

footer{
    text-align:center;
    padding:25px;
    color:#64748b;
    font-size:12px;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    header h1{font-size:25px}

    .circle{
        width:90vw;
        height:90vw;
    }

    .circle-note.major{
        width:48px;
        height:48px;
        font-size:14px;
    }

    .circle-note.minor{
        width:39px;
        height:39px;
        font-size:11px;
    }

    .selected-chord{font-size:27px}

    .diagram-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
<h1>🎵 ML6CMG Chord Finder</h1>
<p>Circle of Fifths • Chords • Fingerings • Music Staff</p>
</header>

<div class="container">

<section class="panel">
<h2 class="circle-title">Circle of Fifths</h2>

<div class="circle" id="circle">
<div class="circle-ring outer"></div>
<div class="circle-ring inner"></div>

<div class="circle-center" id="circleCenter">
C Major
</div>
</div>

<div class="circle-legend">
<span class="legend-major">● Major keys</span>
<span class="legend-minor">● Relative minor keys</span>
</div>
</section>

<section class="panel">

<div class="selected-chord" id="selectedChord">
C Major
</div>

<div class="selected-notes" id="selectedNotes">
Notes: C • E • G
</div>

<input
    class="search"
    id="search"
    placeholder="Search chord type — e.g. 7, maj9, sus4..."
>

<div id="chordLibrary"></div>

</section>

<section class="panel">

<h3 style="text-align:center;margin-top:0">
Show instruments
</h3>

<div class="instrument-buttons">

<button class="instrument-button active" data-instrument="guitar">
🎸 Guitar
</button>

<button class="instrument-button active" data-instrument="ukulele">
🪕 Ukulele
</button>

<button class="instrument-button active" data-instrument="mandolin">
🎻 Mandolin
</button>

<button class="instrument-button active" data-instrument="piano">
🎹 Piano
</button>

</div>
</section>

<section class="panel staff-panel">

<div class="staff-title">🎼 Treble Clef</div>

<div class="staff-subtitle">
Notes contained in the selected chord
</div>

<div class="staff-container">

<svg
    id="staffSvg"
    class="staff-svg"
    viewBox="0 0 900 240"
    preserveAspectRatio="xMidYMid meet">
</svg>

</div>
</section>

<section class="diagram-grid" id="diagramGrid"></section>

</div>

<footer>
ML6 Community Music Group • ML6CMG Chord Finder
</footer>

<script>

/* =====================================================
   NOTE DATA
===================================================== */

const NOTES_SHARP = [
    "C","C#","D","D#","E","F",
    "F#","G","G#","A","A#","B"
];

const NOTES_FLAT = [
    "C","Db","D","Eb","E","F",
    "Gb","G","Ab","A","Bb","B"
];

const NOTE_INDEX = {
    C:0,
    "B#":0,

    "C#":1,
    Db:1,

    D:2,

    "D#":3,
    Eb:3,

    E:4,
    Fb:4,

    F:5,
    "E#":5,

    "F#":6,
    Gb:6,

    G:7,

    "G#":8,
    Ab:8,

    A:9,

    "A#":10,
    Bb:10,

    B:11,
    Cb:11
};


/* =====================================================
   CORRECT MUSICAL SPELLING
===================================================== */

/*
   IMPORTANT:

   The old version converted every F# to Gb.
   That is musically incorrect.

   Chord spelling is now generated according
   to the root letter and chord intervals.

   Example:

   D major = D F# A
   G major = G B D
   F major = F A C
   Bb major = Bb D F
*/

const LETTERS = ["C","D","E","F","G","A","B"];

const LETTER_INDEX = {
    C:0,
    D:1,
    E:2,
    F:3,
    G:4,
    A:5,
    B:6
};

const NATURAL_PITCH = {
    C:0,
    D:2,
    E:4,
    F:5,
    G:7,
    A:9,
    B:11
};

function normalizePitch(n){
    return ((n % 12) + 12) % 12;
}

function rootLetter(root){
    return root.charAt(0);
}

function accidentalForPitch(letter,pitchValue){

    const natural =
        NATURAL_PITCH[letter];

    let difference =
        normalizePitch(pitchValue-natural);

    if(difference===0) return "";

    if(difference===1) return "#";

    if(difference===2) return "##";

    if(difference===11) return "b";

    if(difference===10) return "bb";

    /*
       Fallback for unusual theoretical notes.
    */

    if(difference<=5) return "#";

    return "b";
}


/*
   Intervals are assigned to successive
   diatonic letters.

   This fixes D major:
   D -> F -> A
   F natural = 5
   F# needed to reach 6.
*/

function spellChord(root,type){

    const intervals =
        FORMULAS[type];

    const rootPitch =
        NOTE_INDEX[root];

    const startLetter =
        rootLetter(root);

    const startIndex =
        LETTER_INDEX[startLetter];

    return intervals.map(
        (interval,index)=>{

            let letterIndex =
                startIndex;

            /*
               Chord tones are assigned
               successive letter names.

               0=root
               2=third
               4=fifth
               6=seventh
               8=ninth
               etc.
            */

            if(index>0){

                /*
                   Determine desired scale degree
                   from the interval.
                */

                const degreeMap = {
                    0:0,
                    1:1,
                    2:1,
                    3:2,
                    4:2,
                    5:3,
                    6:3,
                    7:4,
                    8:4,
                    9:5,
                    10:6,
                    11:6
                };

                const degree =
                    degreeMap[interval];

                letterIndex =
                    (
                        startIndex +
                        degree
                    ) % 7;
            }

            const letter =
                LETTERS[letterIndex];

            const targetPitch =
                normalizePitch(
                    rootPitch+interval
                );

            const accidental =
                accidentalForPitch(
                    letter,
                    targetPitch
                );

            return letter+accidental;

        }
    );
}


function pitch(note){
    return NOTE_INDEX[note];
}


function noteNameForPitch(root,number){

    /*
       Used for individual instrument
       frets.

       Prefer the spelling of the chord
       tones when possible.
    */

    const chord =
        spellChord(
            selectedRoot,
            selectedType
        );

    const target =
        normalizePitch(number);

    const matching =
        chord.find(
            n =>
                pitch(n)===target
        );

    if(matching)
        return matching;

    return NOTES_SHARP[target];
}


function chordNotes(root,type){

    return spellChord(
        root,
        type
    );
}


function chordName(){

    return selectedRoot +
        (
            selectedType === ""
            ? " Major"
            : " " +
              TYPE_NAMES[selectedType]
        );
}


function displayNotes(){

    return chordNotes(
        selectedRoot,
        selectedType
    );
}


/* =====================================================
   CIRCLE OF FIFTHS
===================================================== */

const MAJOR_CIRCLE = [
    "C","G","D","A","E","B",
    "F#","Db","Ab","Eb","Bb","F"
];

const MINOR_CIRCLE = [
    "Am","Em","Bm","F#m","C#m","G#m",
    "D#m","Bbm","Fm","Cm","Gm","Dm"
];


/* =====================================================
   CHORD GROUPS
===================================================== */

const CHORD_GROUPS = [

    {
        name:"Basic",
        items:[
            ["Major",""],
            ["Minor","m"]
        ]
    },

    {
        name:"Suspended",
        items:[
            ["Sus2","sus2"],
            ["Sus4","sus4"]
        ]
    },

    {
        name:"Sixths",
        items:[
            ["6","6"],
            ["Minor 6","m6"]
        ]
    },

    {
        name:"Sevenths",
        items:[
            ["7","7"],
            ["Major 7","maj7"],
            ["Minor 7","m7"],
            ["Minor 7 flat 5","m7b5"],
            ["Diminished 7","dim7"]
        ]
    },

    {
        name:"Ninths",
        items:[
            ["Add 9","add9"],
            ["9","9"],
            ["Major 9","maj9"],
            ["Minor 9","m9"]
        ]
    },

    {
        name:"Elevenths",
        items:[
            ["11","11"],
            ["Major 11","maj11"],
            ["Minor 11","m11"]
        ]
    },

    {
        name:"Thirteenths",
        items:[
            ["13","13"],
            ["Major 13","maj13"],
            ["Minor 13","m13"]
        ]
    },

    {
        name:"Altered",
        items:[
            ["Diminished","dim"],
            ["Augmented","aug"]
        ]
    }
];


/* =====================================================
   CHORD FORMULAS
===================================================== */

const FORMULAS = {

    "":[0,4,7],

    "m":[0,3,7],

    "sus2":[0,2,7],

    "sus4":[0,5,7],

    "6":[0,4,7,9],

    "m6":[0,3,7,9],

    "7":[0,4,7,10],

    "maj7":[0,4,7,11],

    "m7":[0,3,7,10],

    "m7b5":[0,3,6,10],

    "dim":[0,3,6],

    "dim7":[0,3,6,9],

    "aug":[0,4,8],

    "add9":[0,4,7,2],

    "9":[0,4,7,10,2],

    "maj9":[0,4,7,11,2],

    "m9":[0,3,7,10,2],

    "11":[0,4,7,10,2,5],

    "maj11":[0,4,7,11,2,5],

    "m11":[0,3,7,10,2,5],

    "13":[0,4,7,10,2,5,9],

    "maj13":[0,4,7,11,2,5,9],

    "m13":[0,3,7,10,2,5,9]
};


/* =====================================================
   DISPLAY NAMES
===================================================== */

const TYPE_NAMES = {

    "":"Major",
    "m":"Minor",
    "sus2":"Sus2",
    "sus4":"Sus4",
    "6":"6",
    "m6":"Minor 6",
    "7":"7",
    "maj7":"Major 7",
    "m7":"Minor 7",
    "m7b5":"Minor 7♭5",
    "dim7":"Diminished 7",
    "dim":"Diminished",
    "aug":"Augmented",
    "add9":"Add9",
    "9":"9",
    "maj9":"Major 9",
    "m9":"Minor 9",
    "11":"11",
    "maj11":"Major 11",
    "m11":"Minor 11",
    "13":"13",
    "maj13":"Major 13",
    "m13":"Minor 13"
};


/* =====================================================
   STATE
===================================================== */

let selectedRoot = "C";
let selectedType = "";

let activeInstruments = {
    guitar:true,
    ukulele:true,
    mandolin:true,
    piano:true
};


/* =====================================================
   CIRCLE
===================================================== */

function buildCircle(){

    const circle =
        document.getElementById("circle");

    circle
        .querySelectorAll(".circle-note")
        .forEach(x=>x.remove());

    MAJOR_CIRCLE.forEach(
        (note,index)=>{

            const angle =
                (index*30-90) *
                Math.PI/180;

            const radius=40;

            const x =
                50+
                radius*Math.cos(angle);

            const y =
                50+
                radius*Math.sin(angle);

            const button =
                document.createElement("button");

            button.className =
                "circle-note major";

            button.style.left=x+"%";
            button.style.top=y+"%";

            button.textContent=note;
            button.title=note+" Major";

            button.onclick=()=>{

                selectedRoot=note;
                selectedType="";
                update();

            };

            circle.appendChild(button);
        }
    );

    MINOR_CIRCLE.forEach(
        (minor,index)=>{

            const root =
                minor.replace("m","");

            const angle =
                (index*30-90) *
                Math.PI/180;

            const radius=27;

            const x =
                50+
                radius*Math.cos(angle);

            const y =
                50+
                radius*Math.sin(angle);

            const button =
                document.createElement("button");

            button.className =
                "circle-note minor";

            button.style.left=x+"%";
            button.style.top=y+"%";

            button.textContent=minor;
            button.title=
                minor+" Relative Minor";

            button.onclick=()=>{

                selectedRoot=root;
                selectedType="m";
                update();

            };

            circle.appendChild(button);
        }
    );
}


/* =====================================================
   HIGHLIGHT CIRCLE
===================================================== */

function highlightCircle(){

    document
        .querySelectorAll(".circle-note")
        .forEach(button=>{

            button.classList.remove("active");

            if(
                selectedType==="m" &&
                button.textContent===
                selectedRoot+"m"
            ){

                button.classList.add("active");

            }

            else if(
                selectedType!=="m" &&
                button.textContent===
                selectedRoot
            ){

                button.classList.add("active");

            }
        });

    document.getElementById(

/* =====================================================
   TREBLE STAFF
===================================================== */

const STAFF_BASE = {
    C:0,
    D:1,
    E:2,
    F:3,
    G:4,
    A:5,
    B:6
};


/*
   Treble staff positions:

   B4 = bottom line
   C5 = space above
   D5 = second line etc.

   Position is measured in diatonic steps.
*/

function staffPosition(note){

    const letter =
        note.charAt(0);

    const accidental =
        note.length>1
        ? note.substring(1)
        : "";

    const letterPosition =
        STAFF_BASE[letter];

    /*
       B4 is position 0.
    */

    const base =
        letterPosition-6;

    return {
        position:base,
        accidental:accidental
    };
}

    notes.forEach((item,index)=>{

        const x =

    ],

    ],

const GUITAR_COMMON = {

    "C":[null,3,2,0,1,0],

    "Cm":[null,3,5,5,4,3],

    "D":[null,null,0,2,3,2],

    "A":[null,0,2,2,2,0],

    "Am":[null,0,2,2,1,0],

    "B":[null,2,4,4,4,2],

    "Bm":[null,2,4,4,3,2]

};


/* =====================================================
   UKULELE COMMON CHORD SHAPES
===================================================== */

const UKULELE_COMMON = {

    "C":[0,0,0,3],

    "Cm":[0,3,3,3],

    "D":[2,2,2,0],

    "Dm":[2,2,1,0],

    "E":[1,4,0,2],

};


/* =====================================================
   CORRECT MANDOLIN COMMON SHAPES
===================================================== */

/*
   Standard mandolin tuning:

   G D A E

   These are the actual four courses,
   displayed low -> high.

   Finger numbers are assigned explicitly
   rather than treating fret numbers
   as finger numbers.
*/

const MANDOLIN_COMMON = {

    "C":[0,2,3,0],

    "Cm":[5,5,4,3],

    "D":[2,0,0,2],

    "Dm":[2,0,0,1],

    "E":[2,2,2,0],

    "Em":[0,2,2,0],

    "F":[3,2,3,1],

    "Fm":[3,1,1,1],

    "G":[0,2,0,3],

    "Gm":[0,3,3,3],

    "A":[2,2,2,0],

    "Am":[2,2,1,0],

    "B":[4,4,4,2],

    "Bm":[4,4,3,2]

};


/* =====================================================
   GET COMMON SHAPE
===================================================== */

function commonShape(instrument){

    const name =
        selectedRoot +
        (
            selectedType==="m"
            ? "m"
            : ""
        );

    let raw=null;

    if(instrument==="guitar")
        raw=GUITAR_COMMON[name];

    if(instrument==="ukulele")
        raw=UKULELE_COMMON[name];

    if(instrument==="mandolin")
        raw=MANDOLIN_COMMON[name];

    if(!raw)
        return null;

    return raw.map(
        fret=>{

            if(fret===null)
                return null;

            return {
                fret:fret,
                note:null,
                finger:0
            };
        }
    );
}


/* =====================================================
   ACCURATE FINGER ASSIGNMENT
===================================================== */

function assignFingerNumbers(shape){

    const fretted =
        shape.filter(
            x=>x && x.fret>0
        );

    /*
       Common open-position shapes need
       natural fingering.

       We determine fingers by fret position,
       but then allow one finger to cover
       multiple strings on the same fret.
    */

    const uniqueFrets =
        [...new Set(
            fretted.map(x=>x.fret)
        )].sort((a,b)=>a-b);

    if(!uniqueFrets.length)
        return;

    const minFret =
        uniqueFrets[0];

    const fingerMap={};

    uniqueFrets.forEach(fret=>{

        const distance =
            fret-minFret;

        fingerMap[fret] =
            distance===0
            ? 1
            : distance===1
            ? 2
            : distance===2
            ? 3
            : 4;
    });

    shape.forEach(item=>{

        if(!item)
            return;

        if(item.fret===0){

            item.finger=0;

        }else{

            item.finger =
                fingerMap[item.fret] || 1;
        }
    });
}


/* =====================================================
   FRETTED VOICING ENGINE
===================================================== */

function getFrettedVoicing(instrument){

    const tuning =
        TUNINGS[instrument];

    const chord =
        chordNotes(
            selectedRoot,
            selectedType
        );

    /*
       Use explicit common shapes first.
    */

    const common =
        commonShape(instrument);

    if(common){

        const result =
            common.map(
                (item,index)=>{

                    if(item===null)
                        return null;

                    const fret =
                        item.fret;

                    if(fret===0){

                        return {
                            fret:0,
                            note:tuning[index],
                            finger:0
                        };
                    }

                    const pitchValue =
                        normalizePitch(
                            pitch(tuning[index])+
                            fret
                        );

                    return {
                        fret:fret,
                        note:noteNameForPitch(
                            selectedRoot,
                            pitchValue
                        ),
                        finger:0
                    };
                }
            );

        assignFingerNumbers(result);

        return {
            shape:result
        };
    }


    /*
       Fallback search for extended chords.
    */

    const possibilities =
        tuning.map(openNote=>{

            const choices=[];

            for(
                let fret=0;
                fret<=12;
                fret++
            ){

                const notePitch =
                    normalizePitch(
                        pitch(openNote)+fret
                    );

                const chordPitch =
                    chord.map(pitch);

                if(
                    chordPitch.includes(
                        notePitch
                    )
                ){

                    choices.push({

                        fret:fret,

                        note:
                            noteNameForPitch(
                                selectedRoot,
                                notePitch
                            )
                    });
                }
            }

            choices.push(null);

            return choices;
        });


    let best=null;


    function evaluate(shape){

        const played =
            shape.filter(Boolean);

        if(!played.length)
            return -999999;

        const notes =
            played.map(x=>x.note);

        const notePitches =
            notes.map(pitch);

        const rootPitch =
            pitch(selectedRoot);

        if(
            !notePitches.includes(
                rootPitch
            )
        ){

            return -999999;
        }

        let score=0;

        score +=
            notePitches.filter(
                n=>n===rootPitch
            ).length*50;

        const intervals =
            notePitches.map(
                n=>normalizePitch(
                    n-rootPitch
                )
            );

        if(
            intervals.includes(3) ||
            intervals.includes(4)
        )
            score+=35;

        if(
            intervals.includes(10) ||
            intervals.includes(11)
        )
            score+=25;

        played.forEach(x=>{

            if(x.fret===0)
                score+=18;
            else
                score-=x.fret*1.5;

        });

        const frets =
            played
            .filter(x=>x.fret>0)
            .map(x=>x.fret);

        if(frets.length){

            const spread =
                Math.max(...frets)-
                Math.min(...frets);

            score-=spread*15;
        }

        if(instrument==="ukulele"){

            played.forEach(x=>{

                if(x.fret<=5)
                    score+=10;

                if(x.fret>7)
                    score-=30;
            });
        }

        return score;
    }


    function search(stringIndex,shape){

        if(
            stringIndex===
            tuning.length
        ){

            const score =
                evaluate(shape);

            if(
                score>-999999 &&
                (
                    !best ||
                    score>best.score
                )
            ){

                best={
                    score:score,
                    shape:[...shape]
                };
            }

            return;
        }

        possibilities[stringIndex]
        .forEach(option=>{

            search(
                stringIndex+1,
                [...shape,option]
            );

        });
    }


    search(0,[]);

    if(!best){

        return {
            shape:
                tuning.map(
                    ()=>null
                )
        };
    }

    assignFingerNumbers(
        best.shape
    );

    return best;
}


/* =====================================================
   DRAW FRETBOARD
===================================================== */

function drawFretted(
    instrument,
    result
){

    const tuning =
        TUNINGS[instrument];

    const count =
        tuning.length;

    const shape =
        result.shape;

    let html=`
        <div class="fret-diagram">
            <div class="fretboard"></div>
    `;


    tuning.forEach(
        (string,i)=>{

            const x =
                50+
                (218/(count-1))*i;

            html+=`

                <div
                    class="fret-string"
                    style="left:${x}px">
                </div>

                <div
                    class="string-label"
                    style="left:${x}px">
                    ${string}
                </div>

            `;
        }
    );


    for(
        let fret=1;
        fret<=5;
        fret++
    ){

        const y =
            65+
            (fret-1)*43;

        html+=`

            <div
                class="fret-number"
                style="top:${y}px">
                ${fret}
            </div>

        `;
    }


    shape.forEach(
        (item,i)=>{

            const x =
                50+
                (218/(count-1))*i;


            if(item===null){

                html+=`

                    <div
                        class="mute-mark"
                        style="left:${x}px">
                        ×
                    </div>

                `;

                return;
            }


            if(item.fret===0){

                html+=`

                    <div
                        class="open-mark"
                        style="left:${x}px">
                        O
                    </div>

                `;

                return;
            }


            const y =
                47+
                (item.fret-.5)*43;

            html+=`

                <div
                    class="finger-dot"
                    style="
                        left:${x}px;
                        top:${y}px;
                    "
                    title="
                        Finger ${item.finger}
                        • Fret ${item.fret}
                        • ${item.note || ""}
                    "
                >
                    ${item.finger}
                </div>

            `;
        }
    );


    html+=`

        <div
            class="finger-key"
            style="
                position:absolute;
                bottom:-4px;
                left:50%;
                transform:translateX(-50%);
                width:100%;
                text-align:center;
                font-size:10px;
                color:#94a3b8;
                white-space:nowrap;
            "
        >
            1 Index&nbsp;&nbsp;
            2 Middle&nbsp;&nbsp;
            3 Ring&nbsp;&nbsp;
            4 Little
        </div>

    `;

    html+=`</div>`;

    return html;
}


/* =====================================================
   PIANO
===================================================== */

function drawPiano(){

    const chord =
        chordNotes(
            selectedRoot,
            selectedType
        );

    const chordPitches =
        chord.map(pitch);

    const white=[
        "C","D","E","F","G","A","B"
    ];

    let html=`

        <div>

            <div class="piano">

    `;


    white.forEach(
        (note,i)=>{

            const active =
                chordPitches.includes(
                    pitch(note)
                );

            html+=`

                <div
                    class="
                        white-key
                        ${active?"active":""}
                    "
                    style="left:${i*40}px"
                >

                    <div class="key-name">
                        ${note}
                    </div>

                </div>

            `;
        }
    );


    const black=[
        ["C#",27],
        ["D#",67],
        ["F#",147],
        ["G#",187],
        ["A#",227]
    ];


    black.forEach(
        ([note,left])=>{

            const active =
                chordPitches.includes(
                    pitch(note)
                );

            html+=`

                <div
                    class="
                        black-key
                        ${active?"active":""}
                    "
                    style="left:${left}px">
                </div>

            `;
        }
    );


    html+=`

            </div>

            <div class="piano-notes">

                ${displayNotes().join(" • ")}

            </div>

        </div>

    `;

    return html;
}

                        instrument
                    ]
                );

                renderInstruments();
            }
        );
    });


/* =====================================================
   SEARCH
===================================================== */

document
    .getElementById("search")
    .addEventListener(
        "input",
        buildChordLibrary
    );


/* =====================================================
   START
===================================================== */

buildCircle();

update();

</script>
