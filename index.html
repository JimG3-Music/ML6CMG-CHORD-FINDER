<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ML6CMG Chord Finder</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
color:#fff;
background:radial-gradient(circle at top,#293951,#111827 45%,#070b12);
}

header{
text-align:center;
padding:22px 15px 12px;
}

header h1{
margin:0;
font-size:30px;
letter-spacing:1px;
}

header p{
margin:7px 0 0;
color:#cbd5e1;
}

.container{
width:min(1200px,96%);
margin:auto;
}

.panel{
background:rgba(15,23,42,.96);
border-radius:20px;
padding:18px;
margin-top:16px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.circle-title{
text-align:center;
margin:0 0 15px;
}

.circle{
position:relative;
width:min(90vw,460px);
height:min(90vw,460px);
margin:auto;
border-radius:50%;
background:radial-gradient(circle,#0d1524 0 27%,#253653 28% 52%,#172033 53% 70%,#0b1220 71%);
border:3px solid #64748b;
box-shadow:inset 0 0 35px #000;
}

.circle-center{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:105px;
height:105px;
border-radius:50%;
background:#0b1220;
border:2px solid #94a3b8;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
font-weight:bold;
font-size:17px;
}

.note{
position:absolute;
width:56px;
height:56px;
margin:-28px;
border-radius:50%;
border:2px solid #94a3b8;
background:#1e293b;
color:#fff;
font-weight:bold;
cursor:pointer;
transition:.15s;
}

.note:hover,
.note.active{
background:#d4af37;
color:#111827;
transform:scale(1.12);
}

.minor-note{
width:46px;
height:46px;
margin:-23px;
font-size:12px;
background:#111827;
}

.selected{
text-align:center;
font-size:31px;
font-weight:bold;
color:#f8e08e;
margin-bottom:15px;
}

.search{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #475569;
background:#0f172a;
color:#fff;
font-size:16px;
margin-bottom:15px;
}

.category{
margin-bottom:16px;
}

.category h3{
margin:0 0 8px;
font-size:14px;
color:#94a3b8;
text-transform:uppercase;
letter-spacing:1px;
}

.buttons{
display:flex;
flex-wrap:wrap;
gap:8px;
}

.chord-button{
background:#1e293b;
color:#fff;
border:1px solid #64748b;
border-radius:10px;
padding:10px 13px;
cursor:pointer;
font-size:14px;
}

.chord-button:hover,
.chord-button.active{
background:#d4af37;
color:#111827;
}

.instrument-buttons{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:9px;
}

.instrument-button{
padding:11px 16px;
border-radius:12px;
border:1px solid #64748b;
background:#111827;
color:#fff;
font-weight:bold;
cursor:pointer;
}

.instrument-button.active{
background:#d4af37;
color:#111827;
}

.diagram-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:16px;
margin-top:16px;
}

.card{
background:#0f172a;
border:1px solid #334155;
border-radius:18px;
padding:15px;
min-height:390px;
}

.card h2{
text-align:center;
margin:0;
color:#f8e08e;
}

.card .type{
text-align:center;
color:#94a3b8;
font-size:13px;
margin:5px 0 15px;
}

.diagram{
min-height:290px;
display:flex;
align-items:center;
justify-content:center;
}

/* FRETTED DIAGRAM */

.fret-diagram{
width:280px;
height:300px;
position:relative;
}

.fretboard{
position:absolute;
left:45px;
right:15px;
top:45px;
bottom:30px;
border-left:4px solid #eee;
border-top:5px solid #eee;
}

.fretboard:after{
content:"";
position:absolute;
left:0;
right:0;
bottom:0;
top:0;
background:
repeating-linear-gradient(
to bottom,
transparent 0,
transparent calc(20% - 1px),
#94a3b8 calc(20% - 1px),
#94a3b8 20%
),
repeating-linear-gradient(
to right,
transparent 0,
transparent calc(25% - 1px),
#94a3b8 calc(25% - 1px),
#94a3b8 25%
);
}

.string{
position:absolute;
top:0;
bottom:0;
width:2px;
background:#d1d5db;
z-index:2;
}

.finger{
position:absolute;
width:30px;
height:30px;
margin:-15px;
border-radius:50%;
background:#d4af37;
color:#111827;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
z-index:6;
}

.open,
.muted{
position:absolute;
top:10px;
transform:translateX(-50%);
font-size:20px;
font-weight:bold;
z-index:6;
}

.open{color:#86efac}
.muted{color:#f87171}

.string-name{
position:absolute;
left:8px;
transform:translateX(-50%);
color:#94a3b8;
font-size:11px;
}

.fret-label{
position:absolute;
left:17px;
color:#94a3b8;
font-size:10px;
}

.barre{
position:absolute;
height:26px;
border-radius:14px;
background:#d4af37;
z-index:4;
opacity:.9;
}

.barre-number{
position:absolute;
width:26px;
height:26px;
border-radius:50%;
background:#d4af37;
color:#111827;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;

/* PIANO */

.piano{
position:relative;
width:280px;
height:180px;
}

.white-key{
position:absolute;
top:0;
height:170px;
width:40px;
background:#fff;
border:1px solid #111827;
z-index:1;
}

.white-key.active{
background:#d4af37;

.black-key{

top:0;

.black-key.active{
background:#d4af37;

.key-label{

width:100%;
text-align:center;

.note-list{

.badge{

color:#94a3b8;
font-size:11px;
margin-top:10px;

footer{
text-align:center;
padding:30px;
color:#64748b;
font-size:12px;

header h1{font-size:25px}
.circle{width:88vw;height:88vw}

<script>

/* =========================================================

const ROOTS=[

];


/* =========================================================

];

];


/* =========================================================
CHORD TYPES
========================================================= */

const CHORD_TYPES=[

{
category:"Basic",

["Major",""],

]
},

{

/* =========================================================
FORMULAS
========================================================= */

const FORMULAS={

"": [0,4,7],
"m":[0,3,7],

"sus2":[0,2,7],
"sus4":[0,5,7],

"6":[0,4,7,9],

/* =========================================================
NOTES
========================================================= */

const NOTE_NAMES=[
"C","C#","D","Eb","E","F",
"F#","G","Ab","A","Bb","B"
];

const NOTE_INDEX={
C:0,C#:1,Db:1,D:2,D#:3,Eb:3,E:4,
F:5,F#:6,Gb:6,G:7,G#:8,Ab:8,
A:9,A#:10,Bb:10,B:11
};


/* =========================================================
STATE
========================================================= */

let selectedRoot="C";
let selectedType="";

let activeInstruments={
guitar:true,
ukulele:true,
mandolin:true,
piano:true
};


/* =========================================================
INSTRUMENT TUNINGS
========================================================= */

const TUNINGS={

guitar:["E","A","D","G","B","E"],

ukulele:["G","C","E","A"],

mandolin:["G","D","A","E"]

};


/* =========================================================
VERIFIED / DEDICATED MANDOLIN DATABASE
---------------------------------------------------------
Numbers are G-D-A-E.
X = muted
0 = open

These are actual mandolin voicings rather than
generated guitar-style shapes.

Where an extended chord cannot practically contain
every theoretical note on four courses, a musical
4-note voicing is used.
========================================================= */

const MANDOLIN={

/* C FAMILY */

"C":{
shape:["0","2","3","0"],
fingers:[0,1,2,0]
},

"Cm":{
shape:["1","3","3","1"],

},

},

},

},

fingers:[0,1,2,3]
},

shape:["0","3","3","1"],
fingers:[0,2,3,1]
},

"C6":{
shape:["2","2","3","3"],
fingers:[1,1,2,3]
},

"Cm6":{
shape:["1","3","3","3"],
fingers:[1,2,3,4]
},

"Cadd9":{
shape:["0","2","3","2"],
fingers:[0,1,2,3]
},

"C9":{
shape:["0","2","1","2"],
fingers:[0,3,1,2]
},

"Cdim":{
shape:["1","2","1","2"],
fingers:[1,2,3,4]
},

"Cdim7":{
shape:["1","2","1","2"],
fingers:[1,2,3,4]
},

"Caug":{
shape:["1","2","3","2"],
fingers:[1,2,3,2]
},


/* G FAMILY */

"G":{
shape:["0","0","2","3"],
fingers:[0,0,1,2]
},

"Gm":{
shape:["0","0","1","3"],
fingers:[0,0,1,3]
},

"G7":{
shape:["0","0","2","1"],
fingers:[0,0,2,1]
},

"Gmaj7":{
shape:["0","0","2","2"],
fingers:[0,0,1,2]
},

"Gm7":{
shape:["0","0","1","1"],
fingers:[0,0,1,1]
},

"Gsus2":{
shape:["0","2","2","3"],
fingers:[0,1,2,3]
},

"Gsus4":{
shape:["0","0","3","3"],
fingers:[0,0,1,2]
},

"G6":{
shape:["0","2","2","3"],
fingers:[0,1,2,3]
},

"Gm6":{
shape:["0","2","1","3"],
fingers:[0,2,1,3]
},

"Gadd9":{
shape:["0","2","2","3"],
fingers:[0,1,2,3]
},

"G9":{
shape:["0","2","1","3"],
fingers:[0,2,1,3]
},

"Gdim":{
shape:["3","4","3","4"],
fingers:[2,3,1,4]
},

"Gdim7":{
shape:["3","4","3","4"],
fingers:[2,3,1,4]
},

"Gaug":{
shape:["1","0","2","3"],
fingers:[1,0,2,3]
},


/* D FAMILY */

"D":{
shape:["2","0","0","2"],
fingers:[1,0,0,2]
},

"Dm":{
shape:["2","0","3","1"],
fingers:[1,0,3,2]
},

"D7":{
shape:["2","0","0","1"],
fingers:[2,0,0,1]
},

"Dmaj7":{
shape:["2","0","0","2"],
fingers:[1,0,0,2]
},

"Dm7":{
shape:["2","0","3","3"],
fingers:[1,0,2,3]
},

"Dsus2":{
shape:["2","2","0","2"],
fingers:[1,2,0,3]
},

"Dsus4":{
shape:["2","0","0","3"],
fingers:[1,0,0,2]
},

"D6":{
shape:["2","0","0","4"],
fingers:[1,0,0,3]
},

"Dm6":{
shape:["2","0","3","3"],
fingers:[1,0,2,3]
},

"Dadd9":{
shape:["2","4","0","2"],
fingers:[1,3,0,2]
},

"D9":{
shape:["2","4","3","2"],
fingers:[1,3,4,2]
},

"Ddim":{
shape:["1","2","1","2"],
fingers:[1,2,3,4]
},

"Ddim7":{
shape:["1","2","1","2"],
fingers:[1,2,3,4]
},

fingers:[3,2,1,4]
},


/* A FAMILY */

"A":{
shape:["2","2","0","0"],

},

"Am":{
shape:["2","2","3","5"],
fingers:[1,2,3,4]
},

"A7":{
shape:["2","2","0","2"],
fingers:[1,2,0,3]
},

"Amaj7":{
shape:["2","2","0","4"],
fingers:[1,2,0,4]
},

"Am7":{
shape:["2","2","3","3"],
fingers:[1,2,3,4]
},

"Asus2":{
shape:["2","2","2","0"],
fingers:[1,2,3,0]
},

"Asus4":{
shape:["2","2","3","3"],
fingers:[1,2,3,4]
},

"A6":{
shape:["2","2","4","5"],
fingers:[1,2,3,4]
},

"Am6":{
shape:["2","2","3","4"],
fingers:[1,2,3,4]
},

"Aadd9":{

fingers:[1,2,3,4]
},

"A9":{
shape:["2","2","4","3"],

},

"Adim":{

},

fingers:[1,2,3,4]
},

"Aaug":{

fingers:[2,3,4,1]
},


/* E FAMILY */

"E":{
shape:["4","2","2","0"],
fingers:[3,1,2,0]
},

"Em":{
shape:["0","2","2","0"],
fingers:[0,1,2,0]
},

"E7":{
shape:["1","2","2","0"],
fingers:[1,2,3,0]
},

"Emaj7":{
shape:["4","2","1","0"],
fingers:[4,3,2,0]
},

"Em7":{

},

},

"Esus4":{

},

},

fingers:[3,2,1,0]
}

};


/* =========================================================
GENERATE MOVABLE MANDOLIN VOICINGS
---------------------------------------------------------
If a direct root chord isn't stored, use recognised
movable shapes based on G-D-A-E fifths tuning.

This is deliberately conservative.
========================================================= */

const MANDO_ROOT_SHAPES={

major:[
[0,0,2,3],
[5,4,3,5]
],

minor:[
[0,0,1,3],
[2,0,3,1]
],

seven:[
[0,0,2,1],
[2,0,0,1]
]

};


function transposeShape(shape,amount){

return shape.map(f=>{
if(f==="X") return "X";
return String(Number(f)+amount);
});

}


function rootNoteAtString(root,stringIndex,fret){

const open=TUNINGS.mandolin[stringIndex];

return NOTE_NAMES[
(NOTE_INDEX[open]+fret)%12
];

}


function findMandolinVoicing(root,type){

const key=root+type;

if(MANDOLIN[key])
return MANDOLIN[key];


let family="major";

if(type==="m"||
type==="m7"||
type==="m6"||
type==="m9"||
type==="m11"||
type==="m13")
family="minor";

else if(type==="7"||
type==="9"||
type==="11"||
type==="13")
family="seven";


const candidates=
MANDO_ROOT_SHAPES[family] || MANDO_ROOT_SHAPES.major;


/*
 Try transposing the known shape through
 the neck until the first note contains
 the requested root.
*/

for(let amount=0;amount<=9;amount++){

for(const base of candidates){

const shape=
transposeShape(base,amount);

let valid=true;

let rootFound=false;

shape.forEach((f,i)=>{

const note=
rootNoteAtString(
root,
i,
Number(f)
);

if(note===root)
rootFound=true;

});

if(rootFound){

return {
shape,
fingers:shape.map((f,i)=>
f==="X"?0:
Math.min(4,(Number(f)%4)||1)
),
generated:true
};

}

}

}


return {
shape:["X","X","X","X"],
fingers:[0,0,0,0],
generated:true
};

}


/* =========================================================
CIRCLE
========================================================= */

function buildCircle(){

const circle=
document.getElementById("circle");

CIRCLE_MAJOR.forEach((note,i)=>{

const angle=(i*30-90)*Math.PI/180;

const x=50+41*Math.cos(angle);
const y=50+41*Math.sin(angle);

const b=document.createElement("button");

b.className="note";

b.style.left=x+"%";
b.style.top=y+"%";

b.textContent=note;

b.onclick=()=>{

selectedRoot=note;
selectedType="";

document
.querySelectorAll(".note")
.forEach(n=>n.classList.remove("active"));

b.classList.add("active");

update();

};

circle.appendChild(b);

});


CIRCLE_MINOR.forEach((note,i)=>{

const angle=(i*30-90)*Math.PI/180;

const x=50+29*Math.cos(angle);
const y=50+29*Math.sin(angle);

const b=document.createElement("button");

b.className="note minor-note";

b.style.left=x+"%";
b.style.top=y+"%";

b.textContent=note;

b.onclick=()=>{

selectedRoot=note.replace("m","");
selectedType="m";

document
.querySelectorAll(".note")
.forEach(n=>n.classList.remove("active"));

b.classList.add("active");

update();

};

circle.appendChild(b);

});

}


/* =========================================================
CHORD NAME
========================================================= */

function chordName(){

const names={

"": "Major",
m:"Minor",
sus2:"Sus2",
sus4:"Sus4",
6:"6",
m6:"Minor 6",
7:"7",
maj7:"Major 7",
m7:"Minor 7",
m7b5:"Minor 7♭5",
dim:"Diminished",
dim7:"Diminished 7",
aug:"Augmented",
add9:"Add9",
9:"9",
maj9:"Major 9",
m9:"Minor 9",
11:"11",
maj11:"Major 11",
m11:"Minor 11",
13:"13",
maj13:"Major 13",
m13:"Minor 13"

};

return selectedRoot+
(selectedType===""?
" Major":
" "+names[selectedType]);

}


/* =========================================================
CHORD NOTES
========================================================= */

function chordNotes(root,type){

const rootIndex=NOTE_INDEX[root];

return FORMULAS[type].map(interval=>
NOTE_NAMES[
(rootIndex+interval+12)%12
]);

}


/* =========================================================
BUTTONS
========================================================= */

function buildChordButtons(){

const box=document.getElementById("chordButtons");

const search=
document.getElementById("search")
.value
.toLowerCase();

box.innerHTML="";

CHORD_TYPES.forEach(group=>{

const section=document.createElement("div");

section.className="category";

const heading=document.createElement("h3");

heading.textContent=group.category;

section.appendChild(heading);

const buttons=document.createElement("div");

buttons.className="buttons";

group.items.forEach(([label,type])=>{

const fullName=selectedRoot+type;

if(
search &&
!fullName.toLowerCase().includes(search) &&
!label.toLowerCase().includes(search)
)return;

const b=document.createElement("button");

b.className="chord-button";

if(type===selectedType)
b.classList.add("active");

b.textContent=fullName;

b.onclick=()=>{

selectedType=type;
update();

};

buttons.appendChild(b);

});

if(buttons.children.length){

section.appendChild(buttons);
box.appendChild(section);

}

});

}


/* =========================================================
DRAW FRETTED DIAGRAM
========================================================= */

function drawFretted(instrument,voicing){

const tuning=TUNINGS[instrument];

const count=tuning.length;

let html=
`<div class="fret-diagram">
<div class="fretboard"></div>`;

tuning.forEach((name,i)=>{

const x=
45+
(220/(count-1))*i;

html+=
`<div class="string"
style="left:${x}px"></div>`;

html+=
`<div class="string-name"
style="left:${x}px;top:18px">
${name}
</div>`;

});


for(let fret=1;fret<=5;fret++){

const y=78+(210/5)*(fret-1);

html+=
`<div class="fret-label"
style="top:${y}px">
${fret}
</div>`;

}


/* BARRE DETECTION */

const numeric=
voicing.shape
.map(x=>x==="X"?null:Number(x));

const counts={};

numeric.forEach(f=>{
if(f>0)
counts[f]=(counts[f]||0)+1;
});

Object.keys(counts).forEach(fret=>{

if(counts[fret]>=3){

const fretNumber=Number(fret);

const positions=[];

numeric.forEach((f,i)=>{
if(f===fretNumber)
positions.push(i);
});

if(positions.length>=3){

const first=positions[0];
const last=positions[positions.length-1];

const x1=
45+(220/(count-1))*first;

const x2=
45+(220/(count-1))*last;

const y=
45+((fretNumber-.5)*42);

html+=
`<div class="barre"
style="
left:${x1}px;
top:${y-13}px;
width:${x2-x1}px;
"></div>`;

}

}

});


/* FINGERS */

voicing.shape.forEach((fret,i)=>{

const x=
45+(220/(count-1))*i;

const finger=
voicing.fingers[i];

if(fret==="X"){

html+=
`<div class="muted"
style="left:${x}px">
×
</div>`;

return;

}

if(Number(fret)===0){

html+=
`<div class="open"
style="left:${x}px">
O
</div>`;

return;

}

const y=
45+
((Number(fret)-.5)*42);

html+=
`<div class="finger"
style="left:${x}px;top:${y}px">
${finger || ""}
</div>`;

});

html+=`</div>`;

return html;

}


/* =========================================================
PIANO
========================================================= */

function drawPiano(notes){

const whites=[
"C","D","E","F","G","A","B"
];

let html=
`<div>
<div class="piano">`;

whites.forEach((note,i)=>{

const active=notes.includes(note);

html+=
`<div class="white-key ${active?"active":""}"
style="left:${i*40}px">

<div class="key-label">
${note}
</div>

</div>`;

});


const blacks=[
["C#",28],
["D#",68],
["F#",148],
["G#",188],
["A#",228]
];

blacks.forEach(([note,left])=>{

const active=notes.includes(note);

html+=
`<div class="black-key ${active?"active":""}"
style="left:${left}px">
</div>`;

});

html+=
`</div>
<div class="note-list">
${notes.join(" • ")}
</div>
</div>`;

return html;

}


/* =========================================================
RENDER
========================================================= */

function render(){

const grid=
document.getElementById("diagramGrid");

grid.innerHTML="";

const notes=
chordNotes(selectedRoot,selectedType);

const instruments=[

["guitar","🎸 Guitar"],
["ukulele","🪕 Ukulele"],
["mandolin","🎻 Mandolin"],
["piano","🎹 Piano"]

];


instruments.forEach(([instrument,title])=>{

if(!activeInstruments[instrument])
return;

const card=document.createElement("div");

card.className="card";

card.innerHTML=
`<h2>${title}</h2>
<div class="type">
${selectedRoot}${selectedType}
</div>`;

const diagram=document.createElement("div");

diagram.className="diagram";


if(instrument==="piano"){

diagram.innerHTML=
drawPiano(notes);

card.appendChild(diagram);

grid.appendChild(card);

return;

}


/*
 Guitar and ukulele retain the general
 voicing engine for now.
*/

if(instrument==="mandolin"){

const voicing=
findMandolinVoicing(
selectedRoot,
selectedType
);

diagram.innerHTML=
drawFretted(
"mandolin",
voicing
);

card.appendChild(diagram);

const badge=
document.createElement("span");

badge.className="badge";

if(voicing.generated){

badge.textContent=
"Mandolin G–D–A–E • practical voicing";

}else{

badge.textContent=
"Mandolin G–D–A–E • chord voicing";

}

card.appendChild(badge);

grid.appendChild(card);

return;

}


/*
 Existing simple generator for guitar/ukulele.
*/

const tuning=TUNINGS[instrument];

let shape=[];

const notesForChord=notes;

tuning.forEach(open=>{

let found=-1;

if(notesForChord.includes(open))
found=0;

else{

for(let fret=1;fret<=7;fret++){

const note=
NOTE_NAMES[
(NOTE_INDEX[open]+fret)%12
];

if(notesForChord.includes(note)){

found=fret;
break;

}

}

}

shape.push(
found===-1?"X":String(found)
);

});

const voicing={
shape,
fingers:shape.map((f,i)=>
f==="X"||f==="0"?0:
Math.min(4,Number(f))
)
};

diagram.innerHTML=
drawFretted(
instrument,
voicing
);

card.appendChild(diagram);

const badge=
document.createElement("span");

badge.className="badge";

badge.textContent=
"Suggested playable voicing";

card.appendChild(badge);

grid.appendChild(card);

});

}


/* =========================================================
UPDATE
========================================================= */

function update(){

document.getElementById("selectedChord")
.textContent=chordName();

document.getElementById("circleCenter")
.textContent=
selectedRoot+
(selectedType || " Major");

buildChordButtons();

render();

}

INSTRUMENT BUTTONS
========================================================= */

document
.querySelectorAll(".instrument-button")
.forEach(button=>{

button.onclick=()=>{

button.dataset.instrument;

activeInstruments[instrument]=
!activeInstruments[instrument];

button.classList.toggle(
"active",
activeInstruments[instrument]
);

render();

};

});


/* =========================================================
SEARCH
========================================================= */

document
.getElementById("search")
.addEventListener("input",()=>{
buildChordButtons();
});


/* =========================================================
START
========================================================= */

buildCircle();

document
.querySelector(".note")
.classList.add("active");

update();

</script>
