<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML6CMG Chord Finder</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:
    radial-gradient(circle at top,#293951 0%,#111827 45%,#070b12 100%);
}

header{
    text-align:center;
    padding:22px 15px 12px;
}

header h1{
    margin:0;
    font-size:30px;
    letter-spacing:1px;
}

header p{
    margin:7px 0 0;
    color:#cbd5e1;
}

.container{
    width:min(1200px,96%);
    margin:auto;
}

.panel{
    background:rgba(15,23,42,.96);
    border-radius:20px;
    padding:18px;
    margin-top:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

/* =========================
   CIRCLE OF FIFTHS
========================= */

.circle-title{
    text-align:center;
    margin:0 0 15px;
}

.circle{
    position:relative;
    width:min(90vw,460px);
    height:min(90vw,460px);
    margin:auto;
    border-radius:50%;
    background:
    radial-gradient(
        circle,
        #0d1524 0 26%,
        #253653 27% 53%,
        #172033 54% 72%,
        #0b1220 73%
    );
    border:3px solid #64748b;
    box-shadow:inset 0 0 35px #000;
}

.circle-center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:105px;
    height:105px;
    border-radius:50%;
    background:#0b1220;
    border:2px solid #94a3b8;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-weight:bold;
    font-size:17px;
}

.note{
    position:absolute;
    width:56px;
    height:56px;
    margin:-28px;
    border-radius:50%;
    border:2px solid #94a3b8;
    background:#1e293b;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
}

.note:hover,
.note.active{
    background:#d4af37;
    color:#111827;
    transform:scale(1.12);
}

.minor-note{
    width:45px;
    height:45px;
    margin:-22.5px;
    font-size:12px;
    background:#111827;
}

/* =========================
   CHORD LIBRARY
========================= */

.selected{
    text-align:center;
    font-size:31px;
    font-weight:bold;
    color:#f8e08e;
    margin-bottom:15px;
}

.search{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #475569;
    background:#0f172a;
    color:#fff;
    font-size:16px;
    margin-bottom:15px;
}

.category{
    margin-bottom:16px;
}

.category h3{
    margin:0 0 8px;
    font-size:14px;
    color:#94a3b8;
    text-transform:uppercase;
    letter-spacing:1px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.chord-button{
    background:#1e293b;
    color:#fff;
    border:1px solid #64748b;
    border-radius:10px;
    padding:10px 13px;
    cursor:pointer;
    font-size:14px;
}

.chord-button:hover,
.chord-button.active{
    background:#d4af37;
    color:#111827;
}

/* =========================
   INSTRUMENT BUTTONS
========================= */

.instrument-buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:9px;
}

.instrument-button{
    padding:11px 16px;
    border-radius:12px;
    border:1px solid #64748b;
    background:#111827;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.instrument-button.active{
    background:#d4af37;
    color:#111827;
}

/* =========================
   CHORD INFORMATION
========================= */

.chord-info{
    text-align:center;
    margin-top:14px;
    color:#cbd5e1;
    line-height:1.6;
}

.chord-info strong{
    color:#f8e08e;
}

/* =========================
   DIAGRAM GRID
========================= */

.diagram-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));
    gap:16px;
    margin-top:16px;
}

.card{
    background:#0f172a;
    border:1px solid #334155;
    border-radius:18px;
    padding:15px;
    min-height:410px;
}

.card h2{
    text-align:center;
    margin:0;
    color:#f8e08e;
}

.card .type{
    text-align:center;
    color:#94a3b8;
    font-size:13px;
    margin:5px 0 15px;
}

.diagram{
    min-height:290px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================
   FRETTED DIAGRAM
========================= */

.fret-diagram{
    width:280px;
    height:300px;
    position:relative;
}

.fretboard{
    position:absolute;
    left:45px;
    right:15px;
    top:45px;
    bottom:30px;
    border-left:4px solid #eee;
    border-top:5px solid #eee;
}

.fretboard:after{
    content:"";
    position:absolute;
    inset:0;

    background:
    repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent calc(20% - 1px),
        #94a3b8 calc(20% - 1px),
        #94a3b8 20%
    ),
    repeating-linear-gradient(
        to right,
        transparent 0,
        transparent calc(25% - 1px),
        #94a3b8 calc(25% - 1px),
        #94a3b8 25%
    );
}

.string{
    position:absolute;
    top:0;
    bottom:0;
    width:2px;
    background:#d1d5db;
    z-index:2;
}

.string-name{
    position:absolute;
    transform:translateX(-50%);
    color:#94a3b8;
    font-size:11px;
}

.fret-label{
    position:absolute;
    left:17px;
    color:#94a3b8;
    font-size:10px;
}

.finger{
    position:absolute;
    width:30px;
    height:30px;
    margin:-15px;
    border-radius:50%;
    background:#d4af37;
    color:#111827;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    z-index:7;
}

.open,
.muted{
    position:absolute;
    top:10px;
    transform:translateX(-50%);
    font-size:20px;
    font-weight:bold;
    z-index:7;
}

.open{color:#86efac}
.muted{color:#f87171}

.barre{
    position:absolute;
    height:27px;
    border-radius:15px;
    background:#d4af37;
    z-index:5;
    opacity:.9;
}

.barre-number{
    position:absolute;
    width:27px;
    height:27px;
    border-radius:50%;
    background:#d4af37;
    color:#111827;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    z-index:8;
}

/* =========================
   PIANO
========================= */

.piano-wrap{
    width:280px;
}

.piano{
    position:relative;
    width:280px;
    height:180px;
}

.white-key{
    position:absolute;
    top:0;
    height:170px;
    width:40px;
    background:#fff;
    border:1px solid #111827;
    z-index:1;
}

.white-key.active{
    background:#d4af37;
}

.black-key{
    position:absolute;
    top:0;
    width:25px;
    height:105px;
    background:#050505;
    border-radius:0 0 5px 5px;
    z-index:3;
}

.black-key.active{
    background:#d4af37;
}

.key-label{
    position:absolute;
    bottom:8px;
    width:100%;
    text-align:center;
    color:#111827;
    font-size:10px;
    font-weight:bold;
}

.note-list{
    text-align:center;
    margin-top:10px;
    color:#cbd5e1;
    font-size:13px;
}

.badge{
    display:block;
    text-align:center;
    color:#94a3b8;
    font-size:11px;
    margin-top:10px;
}

footer{
    text-align:center;
    padding:30px;
    color:#64748b;
    font-size:12px;
}

@media(max-width:600px){

    header h1{
        font-size:25px;
    }

    .circle{
        width:88vw;
        height:88vw;
    }

    .note{
        width:50px;
        height:50px;
        margin:-25px;
    }

    .minor-note{
        width:40px;
        height:40px;
        margin:-20px;
    }

    .diagram-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎵 ML6CMG Chord Finder</h1>
    <p>Visual chords for guitar, ukulele, mandolin & piano</p>
</header>

<div class="container">

<!-- =========================
     CIRCLE
========================= -->

<section class="panel">

<h2 class="circle-title">
Circle of Fifths
</h2>

<div class="circle" id="circle">

<div class="circle-center" id="circleCenter">
C Major
</div>

</div>

</section>


<!-- =========================
     CHORD LIBRARY
========================= -->

<section class="panel">

<div class="selected" id="selectedChord">
C Major
</div>

<input
    class="search"
    id="search"
    placeholder="Search chords e.g. C7, Gm, Fmaj9..."
>

<div id="chordButtons"></div>

<div class="chord-info" id="chordInfo"></div>

</section>


<!-- =========================
     INSTRUMENTS
========================= -->

<section class="panel">

<h3 style="text-align:center;margin-top:0">
Show instruments
</h3>

<div class="instrument-buttons">

<button
class="instrument-button active"
data-instrument="guitar">
🎸 Guitar
</button>

<button
class="instrument-button active"
data-instrument="ukulele">
🪕 Ukulele
</button>

<button
class="instrument-button active"
data-instrument="mandolin">
🎻 Mandolin
</button>

<button
class="instrument-button active"
data-instrument="piano">
🎹 Piano
</button>

</div>

</section>


<!-- =========================
     DIAGRAMS
========================= -->

<section
class="diagram-grid"
id="diagramGrid">
</section>

</div>

<footer>
ML6 Community Music Group • ML6CMG Chord Finder
</footer>


<script>

/* =========================================================
   NOTES
========================================================= */

const NOTE_NAMES=[
"C","C#","D","Eb","E","F",
"F#","G","Ab","A","Bb","B"
];

const NOTE_INDEX={
"C":0,
"C#":1,
"Db":1,
"D":2,
"D#":3,
"Eb":3,
"E":4,
"F":5,
"F#":6,
"Gb":6,
"G":7,
"G#":8,
"Ab":8,
"A":9,
"A#":10,
"Bb":10,
"B":11
};


/* =========================================================
   CIRCLE OF FIFTHS
========================================================= */

const CIRCLE_MAJOR=[
"C","G","D","A","E","B",
"F#","C#","Ab","Eb","Bb","F"
];

const CIRCLE_MINOR=[
"Am","Em","Bm","F#m","C#m","G#m",
"D#m","A#m","Fm","Cm","Gm","Dm"
];


/* =========================================================
   COMPLETE CHORD LIBRARY
========================================================= */

const CHORD_TYPES=[

{
category:"Basic",
items:[
["Major",""],
["Minor","m"]
]
},

{
category:"Suspended",
items:[
["Sus2","sus2"],
["Sus4","sus4"]
]
},

{
category:"Sixths",
items:[
["6","6"],
["Minor 6","m6"]
]
},

{
category:"Sevenths",
items:[
["7","7"],
["Major 7","maj7"],
["Minor 7","m7"],
["Minor 7♭5","m7b5"],
["Diminished 7","dim7"]
]
},

{
category:"Ninths",
items:[
["Add9","add9"],
["9","9"],
["Major 9","maj9"],
["Minor 9","m9"]
]
},

{
category:"Elevenths",
items:[
["11","11"],
["Major 11","maj11"],
["Minor 11","m11"]
]
},

{
category:"Thirteenths",
items:[
["13","13"],
["Major 13","maj13"],
["Minor 13","m13"]
]
},

{
category:"Altered",
items:[
["Diminished","dim"],
["Augmented","aug"]
]
}

];


/* =========================================================
   CHORD FORMULAS
========================================================= */

const FORMULAS={

"": [0,4,7],

"m":[0,3,7],

"sus2":[0,2,7],

"sus4":[0,5,7],

"6":[0,4,7,9],

"m6":[0,3,7,9],

"7":[0,4,7,10],

"maj7":[0,4,7,11],

"m7":[0,3,7,10],

"m7b5":[0,3,6,10],

"dim":[0,3,6],

"dim7":[0,3,6,9],

"aug":[0,4,8],

"add9":[0,4,7,2],

"9":[0,4,7,10,2],

"maj9":[0,4,7,11,2],

"m9":[0,3,7,10,2],

"11":[0,4,7,10,2,5],

"maj11":[0,4,7,11,2,5],

"m11":[0,3,7,10,2,5],

"13":[0,4,7,10,2,5,9],

"maj13":[0,4,7,11,2,5,9],

"m13":[0,3,7,10,2,5,9]

};


/* =========================================================
   STATE
========================================================= */

let selectedRoot="C";
let selectedType="";

let activeInstruments={
    guitar:true,
    ukulele:true,
    mandolin:true,
    piano:true
};


/* =========================================================
   TUNINGS
========================================================= */

const TUNINGS={

guitar:[
"E","A","D","G","B","E"
],

ukulele:[
"G","C","E","A"
],

mandolin:[
"G","D","A","E"
]

};


/* =========================================================
   GET CHORD NOTES
========================================================= */

function chordNotes(root,type){

    const rootIndex=NOTE_INDEX[root];

    return FORMULAS[type].map(interval=>{
        return NOTE_NAMES[
            (rootIndex+interval)%12
        ];
    });
}


/* =========================================================
   CHORD DISPLAY NAME
========================================================= */

function chordDisplayName(){

const names={

"": "Major",
"m":"Minor",

"sus2":"Sus2",
"sus4":"Sus4",

"6":"6",
"m6":"Minor 6",

"7":"7",
"maj7":"Major 7",
"m7":"Minor 7",
"m7b5":"Minor 7♭5",
"dim7":"Diminished 7",

"dim":"Diminished",
"aug":"Augmented",

"add9":"Add9",
"9":"9",
"maj9":"Major 9",
"m9":"Minor 9",

"11":"11",
"maj11":"Major 11",
"m11":"Minor 11",

"13":"13",
"maj13":"Major 13",
"m13":"Minor 13"

};

return selectedRoot+
(
selectedType===""
?" Major"
:" "+names[selectedType]
);

}


/* =========================================================
   BUILD CIRCLE
========================================================= */

function buildCircle(){

const circle=document.getElementById("circle");

CIRCLE_MAJOR.forEach((note,i)=>{

const angle=
(i*30-90)*Math.PI/180;

const x=
50+41*Math.cos(angle);

const y=
50+41*Math.sin(angle);

const button=
document.createElement("button");

button.className="note";

button.style.left=x+"%";
button.style.top=y+"%";

button.textContent=note;

button.onclick=()=>{

selectedRoot=note;
selectedType="";

document
.querySelectorAll(".note")
.forEach(n=>n.classList.remove("active"));

button.classList.add("active");

update();

};

circle.appendChild(button);

});


CIRCLE_MINOR.forEach((note,i)=>{

const angle=
(i*30-90)*Math.PI/180;

const x=
50+29*Math.cos(angle);

const y=
50+29*Math.sin(angle);

const button=
document.createElement("button");

button.className="note minor-note";

button.style.left=x+"%";
button.style.top=y+"%";

button.textContent=note;

button.onclick=()=>{

selectedRoot=
note.replace("m","");

selectedType="m";

document
.querySelectorAll(".note")
.forEach(n=>n.classList.remove("active"));

button.classList.add("active");

update();

};

circle.appendChild(button);

});

}


/* =========================================================
   BUILD CHORD BUTTONS
========================================================= */

function buildChordButtons(){

const box=
document.getElementById("chordButtons");

const search=
document
.getElementById("search")
.value
.toLowerCase()
.trim();

box.innerHTML="";

CHORD_TYPES.forEach(group=>{

const category=
document.createElement("div");

category.className="category";

const heading=
document.createElement("h3");

heading.textContent=
group.category;

category.appendChild(heading);

const buttons=
document.createElement("div");

buttons.className="buttons";

group.items.forEach(([label,type])=>{

const chordName=
selectedRoot+type;

if(
search &&
!chordName.toLowerCase().includes(search) &&
!label.toLowerCase().includes(search)
){
return;
}

const button=
document.createElement("button");

button.className="chord-button";

if(type===selectedType){
button.classList.add("active");
}

button.textContent=
chordName;

button.onclick=()=>{

selectedType=type;

update();

};

buttons.appendChild(button);

});

if(buttons.children.length){

category.appendChild(buttons);

box.appendChild(category);

}

});

}


/* =========================================================
   CHORD INFORMATION
========================================================= */

function updateChordInfo(){

const notes=
chordNotes(
selectedRoot,
selectedType
);

const info=
document.getElementById("chordInfo");

info.innerHTML=
`<strong>${chordDisplayName()}</strong>
<br>
Notes: ${notes.join(" • ")}
<br>
<span style="font-size:12px;color:#94a3b8">
All four instrument diagrams are shown below.
</span>`;

}


/* =========================================================
   GENERIC FRETTED VOICING ENGINE
   Used for guitar and ukulele.
========================================================= */

function findFrettedVoicing(
root,
type,
instrument
){

const tuning=
TUNINGS[instrument];

const notes=
chordNotes(root,type);

let best=null;

function searchString(
index,
current
){

if(index===tuning.length){

const played=
current.filter(x=>x!==null);

if(!played.length){
return;
}

const playedNotes=
played.map(x=>x.note);

if(!playedNotes.includes(root)){
return;
}

const unique=
[...new Set(playedNotes)];

let score=
unique.length*30;

if(
current[0] &&
current[0].note===root
){
score+=30;
}

current.forEach(x=>{

if(x){
score-=x.fret*2;
}

});

const frets=
current
.filter(x=>x)
.map(x=>x.fret);

if(frets.length){

const stretch=
Math.max(...frets)-
Math.min(...frets);

score-=stretch*5;

}

score-=
current.filter(x=>x===null).length*5;

if(
!best ||
score>best.score
){

best={
score:score,
shape:current.map(x=>
x===null
?"X"
:String(x.fret)
),
notes:current
};

}

return;

}


/* Open */

if(notes.includes(tuning[index])){

searchString(
index+1,
[
...current,
{
fret:0,
note:tuning[index]
}
]
);

}


/* Frets 1-7 */

for(
let fret=1;
fret<=7;
fret++
){

const note=
NOTE_NAMES[
(
NOTE_INDEX[tuning[index]]
+
fret
)%12
];

if(notes.includes(note)){

searchString(
index+1,
[
...current,
{
fret:fret,
note:note
}
]
);

}

}


/* Muted */

searchString(
index+1,
[
...current,
null
]
);

}

searchString(0,[]);

if(!best){

return {
shape:tuning.map(()=> "X"),
fingers:tuning.map(()=>0)
};

}

return {
shape:best.shape,
fingers:best.shape.map(
(f,i)=>
f==="X"||f==="0"
?0
:Math.min(4,Number(f))
)
};

}


/* =========================================================
   MANDOLIN CHORD DATABASE
   G-D-A-E
========================================================= */

const MANDOLIN={

/* C */

"C":{
shape:["0","2","3","0"],
fingers:[0,1,2,0]
},

"Cm":{
shape:["1","3","3","1"],
fingers:[1,2,3,1]
},

"C7":{
shape:["0","2","1","3"],
fingers:[0,2,1,3]
},

"Cmaj7":{
shape:["0","2","2","4"],
fingers:[0,1,2,4]
},

"Cm7":{
shape:["1","3","3","4"],
fingers:[1,2,3,4]
},

"Csus2":{
shape:["0","2","3","3"],
fingers:[0,1,2,3]
},

"Csus4":{
shape:["0","3","3","1"],
fingers:[0,2,3,1]
},

"C6":{
shape:["2","2","3","3"],
fingers:[1,2,3,4]
},

"Cm6":{
shape:["1","3","3","3"],
fingers:[1,2,3,4]
},

"Cadd9":{
shape:["0","2","3","2"],
fingers:[0,1,2,3]
},

"C9":{
shape:["0","2","1","2"],
fingers:[0,2,1,3]
},

"Cdim":{
shape:["1","2","1","2"],
fingers:[1,2,3,4]
},

"Cdim7":{
shape:["1","2","1","2"],
fingers:[1,2,3,4]
},

"Caug":{
shape:["1","2","3","2"],
fingers:[1,2,3,4]
},


/* G */

"G":{
shape:["0","0","2","3"],
fingers:[0,0,1,2]
},

"Gm":{
shape:["0","0","1","3"],
fingers:[0,0,1,3]
},

"G7":{
shape:["0","0","2","1"],
fingers:[0,0,2,1]
},

"Gmaj7":{
shape:["0","0","2","2"],
fingers:[0,0,1,2]
},

"Gm7":{
shape:["0","0","1","1"],
fingers:[0,0,1,1]
},

"Gsus2":{
shape:["0","2","2","3"],
fingers:[0,1,2,3]
},

"Gsus4":{
shape:["0","0","3","3"],
fingers:[0,0,1,2]
},

"G6":{
shape:["0","2","2","3"],
fingers:[0,1,2,3]
},

"Gm6":{
shape:["0","2","1","3"],

/* =========================================================
   MANDOLIN MOVABLE SHAPES
========================================================= */

const MANDO_BASE={

major:[
[0,0,2,3],
[2,2,0,0]
],

minor:[
[0,0,1,3],
[2,2,3,5]
],

seven:[
[0,0,2,1],
[2,2,0,2]
]

};


/*
   Determine actual notes produced by a shape.
*/

function shapeNotes(
shape,
tuning
){

return shape.map((fret,i)=>{

if(fret==="X"){
return null;
}

return NOTE_NAMES[
(
NOTE_INDEX[tuning[i]]
+
Number(fret)
)%12
];

});

}


/*
   Find a movable mandolin shape.
*/

function findMandolinVoicing(
root,
type
){

const key=root+type;

/*
   First use a dedicated shape.
*/

if(MANDOLIN[key]){
return MANDOLIN[key];
}


/*
   Select appropriate family.
*/

let family="major";

if(
type==="m" ||
type==="m6" ||
type==="m7" ||
type==="m9" ||
type==="m11" ||
type==="m13"
){
family="minor";
}

else if(
type==="7" ||
type==="9" ||
type==="11" ||
type==="13"
){
family="seven";
}


/*
   For extended chords, we still
   provide a practical four-course
   voicing.
*/

const candidates=
MANDO_BASE[family];

for(
let shift=0;
shift<=7;
shift++
){

for(
const base of candidates
){

const shape=
base.map(fret=>
String(Number(fret)+shift)
);

const notes=
shapeNotes(
shape,
TUNINGS.mandolin
);

if(notes.includes(root)){

return{
shape:shape,
fingers:shape.map(
(f,i)=>
Math.min(
4,
(Number(f)%4)||1
)
),
generated:true
};

}

}

}


/*
   Safe fallback.
*/

return{
shape:["X","X","X","X"],
fingers:[0,0,0,0],
generated:true
};

}


/* =========================================================
   DRAW FRETTED DIAGRAM
========================================================= */

function drawFretted(
instrument,
voicing
){

const tuning=
TUNINGS[instrument];

const count=
tuning.length;

let html=
`<div class="fret-diagram">
<div class="fretboard"></div>`;


/* Strings */

tuning.forEach((note,i)=>{

const x=
45+
(220/(count-1))*i;

html+=
`<div
class="string"
style="left:${x}px">
</div>`;

html+=
`<div
class="string-name"
style="left:${x}px;top:18px">
${note}
</div>`;

});


/* Fret labels */

for(
let fret=1;
fret<=5;
fret++
){

const y=
78+
(210/5)*(fret-1);

html+=
`<div
class="fret-label"
style="top:${y}px">
${fret}
</div>`;

}


/* Detect barres */

const numeric=
voicing.shape.map(
f=>f==="X"
?null
:Number(f)
);

const counts={};

numeric.forEach(f=>{

if(f>0){

counts[f]=
(counts[f]||0)+1;

}

});


Object.keys(counts)
.forEach(fret=>{

if(counts[fret]>=3){

const positions=[];

numeric.forEach((f,i)=>{

if(f===Number(fret)){
positions.push(i);
}

});

if(positions.length>=3){

const first=
positions[0];

const last=
positions[positions.length-1];

const x1=
45+
(220/(count-1))*first;

const x2=
45+
(220/(count-1))*last;

const y=
45+
((Number(fret)-.5)*42);

html+=
`<div
class="barre"
style="
left:${x1}px;
top:${y-13}px;
width:${x2-x1}px;
">
</div>`;

}

}

});


/* Finger dots */

voicing.shape.forEach(
(fret,i)=>{

const x=
45+
(220/(count-1))*i;

if(fret==="X"){

html+=
`<div
class="muted"
style="left:${x}px">
×
</div>`;

return;

}

if(Number(fret)===0){

html+=
`<div
class="open"
style="left:${x}px">
O
</div>`;

return;

}

const y=
45+
((Number(fret)-.5)*42);

const finger=
voicing.fingers[i] || "";

html+=
`<div
class="finger"
style="left:${x}px;top:${y}px">
${finger}
</div>`;

});

html+=`</div>`;

return html;

}


/* =========================================================
   PIANO DIAGRAM
========================================================= */

function drawPiano(notes){

const whites=[
"C","D","E","F","G","A","B"
];

let html=
`<div class="piano-wrap">
<div class="piano">`;


/* White keys */

whites.forEach(
(note,i)=>{

const active=
notes.includes(note);

html+=
`<div
class="white-key ${active?"active":""}"
style="left:${i*40}px">

<div class="key-label">
${note}
</div>

</div>`;

});


/* Black keys */

const blacks=[
["C#",28],
["D#",68],
["F#",148],
["G#",188],
["A#",228]
];

blacks.forEach(
([note,left])=>{

const active=
notes.includes(note);

html+=
`<div
class="black-key ${active?"active":""}"
style="left:${left}px">
</div>`;

});


html+=
`</div>

<div class="note-list">
${notes.join(" • ")}
</div>

</div>`;

return html;

}
