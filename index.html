<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ML6CMG Chord Finder</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:
radial-gradient(circle at top,#26364e 0%,#101827 45%,#060a11 100%);
color:#fff;
font-family:Arial,Helvetica,sans-serif;
}

header{
text-align:center;
padding:22px 12px 10px;
}

header h1{
margin:0;
font-size:30px;
letter-spacing:.5px;
}

header p{
margin:7px 0 0;
color:#b9c4d4;
}

.container{
width:min(1200px,96%);
margin:auto;
}

.panel{
background:rgba(12,20,34,.97);
border:1px solid #334155;
border-radius:20px;
padding:18px;
margin:16px 0;
box-shadow:0 12px 35px rgba(0,0,0,.28);
}

h2{
margin-top:0;
}

/* =====================================================
   CIRCLE OF FIFTHS
===================================================== */

.circle-title{
text-align:center;
margin-bottom:15px;
}

.circle{
position:relative;
width:min(92vw,470px);
height:min(92vw,470px);
margin:auto;
border-radius:50%;
background:
radial-gradient(circle,
#0b1220 0 23%,
#273850 24% 51%,
#172236 52% 72%,
#0b1220 73%);
border:3px solid #64748b;
box-shadow:
inset 0 0 35px #000,
0 10px 30px rgba(0,0,0,.4);
}

.circle-ring{
position:absolute;
border:1px solid #53647d;
border-radius:50%;
pointer-events:none;
}

.circle-ring.outer{
inset:16%;
}

.circle-ring.inner{
inset:29%;
}

.circle-center{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:112px;
height:112px;
border-radius:50%;
background:#0a111d;
border:2px solid #d4af37;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
font-weight:bold;
font-size:17px;
padding:10px;
}

.circle-note{
position:absolute;
transform:translate(-50%,-50%);
border:2px solid #94a3b8;
background:#1e293b;
color:#fff;
font-weight:bold;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
transition:.15s;
z-index:5;
}

.circle-note.major{
width:55px;
height:55px;
border-radius:50%;
font-size:16px;
}

.circle-note.minor{
width:46px;
height:46px;
border-radius:50%;
font-size:12px;
background:#111827;
}

.circle-note:hover,
.circle-note.active{
background:#d4af37;
color:#101827;
border-color:#f8e08e;
transform:translate(-50%,-50%) scale(1.1);
}

.circle-label{
position:absolute;
text-align:center;
font-size:10px;
color:#94a3b8;
pointer-events:none;
}

.circle-legend{
display:flex;
justify-content:center;
gap:22px;
margin-top:14px;
font-size:13px;
color:#cbd5e1;
}

.legend-major{
color:#f8e08e;
}

.legend-minor{
color:#94a3b8;
}

/* =====================================================
   CHORD SELECTOR
===================================================== */

.selected-chord{
text-align:center;
font-size:32px;
font-weight:bold;
color:#f8e08e;
margin-bottom:8px;
}

.selected-notes{
text-align:center;
font-size:17px;
color:#cbd5e1;
margin-bottom:18px;
}

.search{
width:100%;
padding:13px;
border-radius:11px;
border:1px solid #475569;
background:#0b1220;
color:#fff;
font-size:16px;
margin-bottom:15px;
}

.category{
margin-bottom:17px;
}

.category h3{
font-size:13px;
text-transform:uppercase;
letter-spacing:1px;
color:#94a3b8;
margin:0 0 8px;
}

.chord-buttons{
display:flex;
flex-wrap:wrap;
gap:8px;
}

.chord-button{
padding:10px 13px;
border-radius:10px;
border:1px solid #475569;
background:#1e293b;
color:#fff;
font-size:14px;
cursor:pointer;
}

.chord-button:hover,
.chord-button.active{
background:#d4af37;
color:#111827;
border-color:#f8e08e;
}

/* =====================================================
   INSTRUMENT BUTTONS
===================================================== */

.instrument-buttons{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:9px;
}

.instrument-button{
padding:11px 16px;
border-radius:11px;
border:1px solid #64748b;
background:#111827;
color:#fff;
font-weight:bold;
cursor:pointer;
}

.instrument-button.active{
background:#d4af37;
color:#111827;
}

/* =====================================================
   MUSIC STAFF
===================================================== */

.staff-panel{
margin-top:18px;
}

.staff-title{
text-align:center;
font-size:20px;
font-weight:bold;
color:#f8e08e;
margin-bottom:3px;
}

.staff-subtitle{
text-align:center;
color:#94a3b8;
font-size:13px;
margin-bottom:8px;
}

.staff-container{
width:100%;
overflow-x:auto;
}

.staff-svg{
display:block;
width:100%;
min-width:620px;
height:240px;
}

.staff-line{
stroke:#d7dce3;
stroke-width:2;
}

.staff-note{
fill:#f8e08e;
stroke:#111827;
stroke-width:1.5;
}

.staff-note-label{
fill:#fff;
font-size:14px;
font-weight:bold;
text-anchor:middle;
}

.staff-accidental{
fill:#fff;
font-size:20px;
font-weight:bold;
}

.staff-clef{
fill:#fff;
font-family:"Times New Roman",serif;
font-size:82px;
}

.staff-ledger{
stroke:#d7dce3;
stroke-width:2;
}

/* =====================================================
   DIAGRAM GRID
===================================================== */

.diagram-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(285px,1fr));
gap:16px;
}

.card{
background:#0c1422;
border:1px solid #334155;
border-radius:18px;
padding:15px;
min-height:420px;
}

.card h2{
text-align:center;
margin:0;
color:#f8e08e;
}

.card-sub{
text-align:center;
color:#94a3b8;
font-size:12px;
margin:5px 0 14px;
}

.diagram{
height:300px;
display:flex;
align-items:center;
justify-content:center;
}

.badge{
display:block;
text-align:center;
font-size:11px;
color:#64748b;
margin-top:7px;
}

/* =====================================================
   FRETBOARD DIAGRAM
===================================================== */

.fret-diagram{
width:285px;
height:300px;
position:relative;
}

.fretboard{
position:absolute;
left:50px;
right:16px;
top:47px;
height:220px;
border-left:4px solid #eee;
border-top:5px solid #eee;
background:
repeating-linear-gradient(
to bottom,
transparent 0,
transparent 43px,
#94a3b8 43px,
#94a3b8 45px
),
repeating-linear-gradient(
to right,
transparent 0,
transparent 53px,
#94a3b8 53px,
#94a3b8 55px
);
}

.fret-string{
position:absolute;
top:0;
bottom:0;
width:2px;
background:#d7dce3;
z-index:3;
}

.string-label{
position:absolute;
top:18px;
transform:translateX(-50%);
font-size:11px;
color:#94a3b8;
}

.fret-number{
position:absolute;
left:18px;
font-size:10px;
color:#94a3b8;
}

.open-mark,
.mute-mark{
position:absolute;
top:5px;
transform:translateX(-50%);
font-size:20px;
font-weight:bold;
z-index:8;
}

.open-mark{
color:#86efac;
}

.mute-mark{
color:#f87171;
}

.finger-dot{
position:absolute;
width:31px;
height:31px;
border-radius:50%;
background:#d4af37;
color:#111827;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
z-index:8;
transform:translate(-50%,-50%);
}

.fret-barre{
position:absolute;
height:29px;
background:#d4af37;
border-radius:15px;
z-index:6;
}

/* =====================================================
   PIANO
===================================================== */

.piano{
position:relative;
width:280px;
height:190px;
}

.white-key{
position:absolute;
top:0;
height:175px;
width:40px;
background:#fff;
border:1px solid #111827;
z-index:1;
}

.white-key.active{
background:#d4af37;
}

.black-key{
position:absolute;
top:0;
width:25px;
height:108px;
background:#050505;
border-radius:0 0 5px 5px;
z-index:3;
}

.black-key.active{
background:#d4af37;
}

.key-name{
position:absolute;
bottom:8px;
width:100%;
text-align:center;
color:#111827;
font-size:10px;
font-weight:bold;
}

.piano-notes{
text-align:center;
font-size:12px;
color:#cbd5e1;
margin-top:10px;
}

/* =====================================================
   FOOTER
===================================================== */

footer{
text-align:center;
padding:25px;
color:#64748b;
font-size:12px;
}

@media(max-width:600px){

header h1{
font-size:25px;
}

.circle{
width:90vw;
height:90vw;
}

.circle-note.major{
width:48px;
height:48px;
font-size:14px;
}

.circle-note.minor{
width:39px;
height:39px;
font-size:11px;
}

.selected-chord{
font-size:27px;
}

.diagram-grid{
grid-template-columns:1fr;
}

}
</style>
</head>

<body>

<header>
<h1>🎵 ML6CMG Chord Finder</h1>
<p>Circle of Fifths • Chords • Fingerings • Music Staff</p>
</header>

<div class="container">

<!-- =====================================================
     CIRCLE OF FIFTHS
===================================================== -->

<section class="panel">

<h2 class="circle-title">Circle of Fifths</h2>

<div class="circle" id="circle">

<div class="circle-ring outer"></div>
<div class="circle-ring inner"></div>

<div class="circle-center" id="circleCenter">
C Major
</div>

</div>

<div class="circle-legend">
<span class="legend-major">● Major keys</span>
<span class="legend-minor">● Relative minor keys</span>
</div>

</section>


<!-- =====================================================
     CHORD LIBRARY
===================================================== -->

<section class="panel">

<div class="selected-chord" id="selectedChord">
C Major
</div>

<div class="selected-notes" id="selectedNotes">
Notes: C • E • G
</div>

<input
class="search"
id="search"
placeholder="Search chord type — e.g. 7, maj9, sus4..."
>

<div id="chordLibrary"></div>

</section>


<!-- =====================================================
     INSTRUMENT SELECTOR
===================================================== -->

<section class="panel">

<h3 style="text-align:center;margin-top:0">
Show instruments
</h3>

<div class="instrument-buttons">

<button
class="instrument-button active"
data-instrument="guitar">
🎸 Guitar
</button>

<button
class="instrument-button active"
data-instrument="ukulele">
🪕 Ukulele
</button>

<button
class="instrument-button active"
data-instrument="mandolin">
🎻 Mandolin
</button>

<button
class="instrument-button active"
data-instrument="piano">
🎹 Piano
</button>

</div>

</section>


<!-- =====================================================
     TREBLE CLEF
===================================================== -->

<section class="panel staff-panel">

<div class="staff-title">
🎼 Treble Clef
</div>

<div class="staff-subtitle">
Notes contained in the selected chord
</div>

<div class="staff-container">
<svg
id="staffSvg"
class="staff-svg"
viewBox="0 0 900 240"
preserveAspectRatio="xMidYMid meet">
</svg>
</div>

</section>


<!-- =====================================================
     INSTRUMENT DIAGRAMS
===================================================== -->

<section
class="diagram-grid"
id="diagramGrid">
</section>

</div>

<footer>
ML6 Community Music Group • ML6CMG Chord Finder
</footer>


<script>

/* =====================================================
   NOTE DATA
===================================================== */

const NOTES=[
"C","C#","D","D#","E","F",
"F#","G","G#","A","A#","B"
];

const DISPLAY_FLATS={
"C#":"Db",
"D#":"Eb",
"F#":"Gb",
"G#":"Ab",
"A#":"Bb"
};

const NOTE_INDEX={
"C":0,
"B#":0,
"C#":1,
"Db":1,
"D":2,
"D#":3,
"Eb":3,
"E":4,
"Fb":4,
"E#":5,
"F":5,
"F#":6,
"Gb":6,
"G":7,
"G#":8,
"Ab":8,
"A":9,
"A#":10,
"Bb":10,
"B":11,
"Cb":11
};


/* =====================================================
   CIRCLE OF FIFTHS
===================================================== */

const MAJOR_CIRCLE=[
"C","G","D","A","E","B",
"F#","Db","Ab","Eb","Bb","F"
];

const MINOR_CIRCLE=[
"Am","Em","Bm","F#m","C#m","G#m",
"D#m","Bbm","Fm","Cm","Gm","Dm"
];


/* =====================================================
   CHORD TYPES
===================================================== */

const CHORD_GROUPS=[

{
name:"Basic",
items:[
["Major",""],
["Minor","m"]
]
},

{
name:"Suspended",
items:[
["Sus2","sus2"],
["Sus4","sus4"]
]
},

{
name:"Sixths",
items:[
["6","6"],
["Minor 6","m6"]
]
},

{
name:"Sevenths",
items:[
["7","7"],
["Major 7","maj7"],
["Minor 7","m7"],
["Minor 7 flat 5","m7b5"],
["Diminished 7","dim7"]
]
},

{
name:"Ninths",
items:[
["Add 9","add9"],
["9","9"],
["Major 9","maj9"],
["Minor 9","m9"]
]
},

{
name:"Elevenths",
items:[
["11","11"],
["Major 11","maj11"],
["Minor 11","m11"]
]
},

{
name:"Thirteenths",
items:[
["13","13"],
["Major 13","maj13"],
["Minor 13","m13"]
]
},

{
name:"Altered",
items:[
["Diminished","dim"],
["Augmented","aug"]
]
}

];


/* =====================================================
   CHORD FORMULAS
===================================================== */

const FORMULAS={

"":     [0,4,7],
"m":    [0,3,7],

"sus2": [0,2,7],
"sus4": [0,5,7],

"6":    [0,4,7,9],
"m6":   [0,3,7,9],

"7":    [0,4,7,10],
"maj7": [0,4,7,11],
"m7":   [0,3,7,10],
"m7b5": [0,3,6,10],

"dim":  [0,3,6],
"dim7": [0,3,6,9],
"aug":  [0,4,8],

"add9": [0,4,7,2],
"9":    [0,4,7,10,2],
"maj9": [0,4,7,11,2],
"m9":   [0,3,7,10,2],

"11":   [0,4,7,10,2,5],
"maj11":[0,4,7,11,2,5],
"m11":  [0,3,7,10,2,5],

"13":   [0,4,7,10,2,5,9],
"maj13":[0,4,7,11,2,5,9],
"m13":  [0,3,7,10,2,5,9]
};


/* =====================================================
   CHORD NAMES
===================================================== */

const TYPE_NAMES={

"": "Major",
"m":"Minor",

"sus2":"Sus2",
"sus4":"Sus4",

"6":"6",
"m6":"Minor 6",

"7":"7",
"maj7":"Major 7",
"m7":"Minor 7",
"m7b5":"Minor 7♭5",
"dim7":"Diminished 7",

"dim":"Diminished",
"aug":"Augmented",

"add9":"Add9",
"9":"9",
"maj9":"Major 9",
"m9":"Minor 9",

"11":"11",
"maj11":"Major 11",
"m11":"Minor 11",

"13":"13",
"maj13":"Major 13",
"m13":"Minor 13"
};


/* =====================================================
   STATE
===================================================== */

let selectedRoot="C";
let selectedType="";

let activeInstruments={
guitar:true,
ukulele:true,
mandolin:true,
piano:true
};


/* =====================================================
   HELPERS
===================================================== */

function pitch(note){
return NOTE_INDEX[note];
}

function normalizePitch(n){
return ((n%12)+12)%12;
}

function chordNotes(root,type){

const rootPitch=pitch(root);

return FORMULAS[type].map(interval=>{
return NOTES[
normalizePitch(rootPitch+interval)
];
});
}

function chordName(){

return selectedRoot+
(
selectedType===""
?" Major"
:
" "+TYPE_NAMES[selectedType]
);

}

function prettyNote(note){

return DISPLAY_FLATS[note] || note;

}

function displayNotes(){

return chordNotes(
selectedRoot,
selectedType
).map(prettyNote);

}


/* =====================================================
   BUILD CIRCLE
===================================================== */

function buildCircle(){

const circle=
document.getElementById("circle");

const old=
circle.querySelectorAll(".circle-note");

old.forEach(x=>x.remove());


/* Major */

MAJOR_CIRCLE.forEach((note,index)=>{

const angle=
(index*30-90)*Math.PI/180;

const radius=40;

const x=
50+radius*Math.cos(angle);

const y=
50+radius*Math.sin(angle);

const button=
document.createElement("button");

button.className="circle-note major";

button.style.left=x+"%";
button.style.top=y+"%";

button.textContent=note;

button.title=note+" Major";

button.onclick=()=>{

selectedRoot=note;
selectedType="";

update();

};

circle.appendChild(button);

});


/* Relative minor */

MINOR_CIRCLE.forEach((minor,index)=>{

const root=
minor.replace("m","");

const angle=
(index*30-90)*Math.PI/180;

const radius=27;

const x=
50+radius*Math.cos(angle);

const y=
50+radius*Math.sin(angle);

const button=
document.createElement("button");

button.className="circle-note minor";

button.style.left=x+"%";
button.style.top=y+"%";

button.textContent=minor;

button.title=
minor+" Relative Minor";

button.onclick=()=>{

selectedRoot=root;
selectedType="m";

update();

};

circle.appendChild(button);

});

}


/* =====================================================
   HIGHLIGHT CIRCLE
===================================================== */

function highlightCircle(){

document
.querySelectorAll(".circle-note")
.forEach(button=>{

button.classList.remove("active");

if(
selectedType==="m"
&&
button.textContent===selectedRoot+"m"
){

button.classList.add("active");

}

else if(
selectedType!=="m"
&&
button.textContent===selectedRoot
){

button.classList.add("active");

}

});

document
.getElementById("circleCenter")
.textContent=
chordName();

}


/* =====================================================
   BUILD CHORD LIBRARY
===================================================== */

function buildChordLibrary(){

const library=
document.getElementById("chordLibrary");

const search=
document
.getElementById("search")
.value
.toLowerCase()
.trim();

library.innerHTML="";

CHORD_GROUPS.forEach(group=>{

const category=
document.createElement("div");

category.className="category";

const heading=
document.createElement("h3");

heading.textContent=
group.name;

category.appendChild(heading);

const buttons=
document.createElement("div");

buttons.className="chord-buttons";

group.items.forEach(item=>{

const label=item[0];
const type=item[1];

const fullName=
selectedRoot+type;

if(
search &&
!label.toLowerCase().includes(search) &&
!fullName.toLowerCase().includes(search)
){

return;

}

const button=
document.createElement("button");

button.className="chord-button";

if(type===selectedType){
button.classList.add("active");
}

button.textContent=
selectedRoot+
(
type===""
?""
:type
);

button.title=label;

button.onclick=()=>{

selectedType=type;

update();

};

buttons.appendChild(button);

});

if(buttons.children.length){

category.appendChild(buttons);
library.appendChild(category);

}

});

}


/* =====================================================
   STAFF NOTE SPELLING
===================================================== */

/*
Musical staff positions use letter names rather
than raw chromatic positions.

Treble clef:
bottom line = E
then F G A B C D E F...
*/

const STAFF_LETTERS=[
"C","D","E","F","G","A","B"
];

function letterIndex(letter){

return STAFF_LETTERS.indexOf(letter);

}

function noteLetter(note){

return note.replace("#","");

}

function noteStep(note){

const letter=noteLetter(note);

return letterIndex(letter);

}


/* =====================================================
   CREATE MUSICAL STAFF
===================================================== */

function renderStaff(){

const svg=
document.getElementById("staffSvg");

svg.innerHTML="";


/* Staff position */

const top=70;
const spacing=18;

for(let i=0;i<5;i++){

const line=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

line.setAttribute("x1","105");
line.setAttribute("x2","855");

line.setAttribute(
"y1",
top+i*spacing
);

line.setAttribute(
"y2",
top+i*spacing
);

line.setAttribute(
"class",
"staff-line"
);

svg.appendChild(line);

}


/* Treble clef */

const clef=
document.createElementNS(
"http://www.w3.org/2000/svg",
"text"
);

clef.setAttribute("x","35");
clef.setAttribute("y","142");
clef.setAttribute("class","staff-clef");

clef.textContent="𝄞";

svg.appendChild(clef);


/*
Staff positions:

Bottom line E4 = 0
F4 = 1
G4 = 2
A4 = 3
B4 = 4
C5 = 5
D5 = 6
E5 = 7
F5 = 8
G5 = 9
A5 = 10
B5 = 11
C6 = 12
...
*/

const staffBase={
"C":5,
"D":6,
"E":0,
"F":1,
"G":2,
"A":3,
"B":4
};


/*
Use octave-aware pitches for the displayed
chord. We choose the nearest practical octave
for each chord tone and stack them upward.
*/

const notes=
chordNotes(
selectedRoot,
selectedType
);

let musicalNotes=[];


/* Start around middle C */

let previous=-100;

notes.forEach(note=>{

let base=
staffBase[noteLetter(note)];

let octave=4;

let position=
base+
(octave-4)*7;


/*
Find a position above previous note.
This gives the staff a stacked chord appearance.
*/

while(position<=previous){
octave++;
position=
base+
(octave-4)*7;
}

previous=position;

musicalNotes.push({
note:note,
position:position
});

});


/*
Sort from low to high.
*/

musicalNotes.sort(
(a,b)=>a.position-b.position
);


/* Place notes */

const startX=175;
const availableWidth=630;

const stepX=
musicalNotes.length>1
?
availableWidth/(musicalNotes.length-1)
:
0;

musicalNotes.forEach((item,index)=>{

const x=
musicalNotes.length===1

490
:
startX+stepX*index;

const position=item.position;

const y=
top+4*spacing-position*(spacing/2);


/*
Ledger lines below
*/

if(position<0){

for(
let p=-2;
p>=position;
p-=2

"y2",
top+4*spacing-p*(spacing/2)
);

"class",
"staff-ledger"
);

svg.appendChild(ledger);

}


/*
Ledger lines above
*/

if(position>8){

for(
let p=10;
p<=position;
p+=2
){

document.createElementNS(

"line"
);

);

"class",
"staff-ledger"
);

}


/*

*/

if(item.note.includes("#")){

const accidental=
document.createElementNS(
"http://www.w3.org/2000/svg",
"text"
);

accidental.setAttribute(
"x",
x-26
);

"y",
y+7
);

"staff-accidental"
);

accidental.textContent="♯";

svg.appendChild(accidental);

}


/*
Note head
*/

const note=
document.createElementNS(
"http://www.w3.org/2000/svg",

);

note.setAttribute("cx",x);
note.setAttribute("cy",y);
note.setAttribute("rx","10");
note.setAttribute("ry","7");

note.setAttribute(
"class",
"staff-note"
);

note.setAttribute(

svg.appendChild(note);


/*
Stem
*/

const stem=
document.createElementNS(
"http://www.w3.org/2000/svg",

);

stem.setAttribute("x1",x+8);

x

/* =====================================================
   TUNINGS
===================================================== */

const TUNINGS={

guitar:[
"E","A","D","G","B","E"
],

ukulele:[
"G","C","E","A"
],

mandolin:[
"G","D","A","E"
]

};


/* =====================================================
   FRETTED CHORD ENGINE
===================================================== */

function getFrettedVoicing(
instrument
){

const tuning=
TUNINGS[instrument];

const target=
chordNotes(
selectedRoot,
selectedType
);

let best=null;


/*
Search possible fret combinations.
We deliberately favour:
- chord tones
- root
- open strings
- smaller fret spans
*/

function search(
stringIndex,
shape
){

if(stringIndex===tuning.length){

const played=
shape.filter(x=>x!==null);

if(!played.length)return;

const playedNotes=
played.map(x=>x.note);

if(!playedNotes.includes(selectedRoot))
return;

const unique=
new Set(playedNotes);

let score=
unique.size*50;

if(
playedNotes[0]===selectedRoot
){
score+=30;
}

shape.forEach(x=>{

if(x){

score-=x.fret*2;

}

});

const frets=
shape
.filter(Boolean)
.map(x=>x.fret);

if(frets.length){

score-=
(
Math.max(...frets)-
Math.min(...frets)
)*8;

}

if(
!best ||
score>best.score
){

best={
score:score,
shape:shape
};

}

return;
}


/*
Open string
*/

const openNote=
tuning[stringIndex];

if(target.includes(openNote)){

search(
stringIndex+1,
[
...shape,
{
fret:0,
note:openNote
}
]
);

}


/*
Frets 1-7
*/

for(
let fret=1;
fret<=7;
fret++
){

const note=
NOTES[
normalizePitch(
pitch(openNote)+fret
)
];

if(target.includes(note)){

search(
stringIndex+1,
[
...shape,
{
fret:fret,
note:note
}
]
);

}

}


/*
Mute
*/

search(
stringIndex+1,
[
...shape,
null
]
);

}

search(0,[]);


if(!best){

return{
shape:tuning.map(()=>null)
};

}

return best;

}


/* =====================================================
   MANDOLIN
===================================================== */

/*
The mandolin is tuned G-D-A-E.

Rather than pretending every extended chord has
one universal fingering, the engine searches the
four courses for a playable voicing of the actual
selected chord.
*/

function getMandolinVoicing(){

return getFrettedVoicing("mandolin");

}


/* =====================================================
   DRAW FRETTED DIAGRAM
===================================================== */

function drawFretted(
instrument,
result
){

const tuning=
TUNINGS[instrument];

const count=tuning.length;

const shape=
result.shape;

let html=
`<div class="fret-diagram">
<div class="fretboard"></div>`;


/*
Strings
*/

tuning.forEach((string,i)=>{

const x=
50+
(218/(count-1))*i;

html+=
`<div
class="fret-string"
style="left:${x}px">
</div>`;

html+=
`<div
class="string-label"
style="left:${x}px">
${string}
</div>`;

});


/*
Fret numbers
*/

for(let fret=1;fret<=5;fret++){

const y=
65+(fret-1)*43;

html+=
`<div
class="fret-number"
style="top:${y}px">
${fret}
</div>`;

}


/*
Dots
*/

shape.forEach((item,i)=>{

const x=
50+
(218/(count-1))*i;

if(item===null){

html+=
`<div
class="mute-mark"
style="left:${x}px">
×
</div>`;

return;

}

if(item.fret===0){

html+=
`<div
class="open-mark"
style="left:${x}px">
O
</div>`;

return;

}

const y=
47+
(item.fret-0.5)*43;

html+=
`<div
class="finger-dot"
style="left:${x}px;top:${y}px">
${Math.min(4,item.fret)}
</div>`;

});


html+=`</div>`;

return html;

}


/* =====================================================
   PIANO
===================================================== */

function drawPiano(){

const chord=
chordNotes(
selectedRoot,
selectedType
);

const white=[
"C","D","E","F","G","A","B"
];

let html=
`<div>
<div class="piano">`;


/*
White keys
*/

white.forEach((note,i)=>{

const active=
chord.includes(note);

html+=
`<div
class="white-key ${active?"active":""}"
style="left:${i*40}px">

<div class="key-name">
${note}
</div>

</div>`;

});


/*
Black keys
*/

const black=[
["C#",27],
["D#",67],
["F#",147],
["G#",187],
["A#",227]
];

black.forEach(([note,left])=>{

const active=
chord.includes(note);

html+=
`<div
class="black-key ${active?"active":""}"
style="left:${left}px">
</div>`;

});


html+=
`</div>
<div class="piano-notes">
${displayNotes().join(" • ")}
</div>
</div>`;

return html;

}
